  $('pv-cand').onclick = () => troca(false);
  troca(true);
  contaNumeros();
}

function legenda(el, series, clicavel) {
  el.innerHTML = '';
  series.forEach(s => {
    const b = document.createElement('button');
    b.type = 'button'; b.setAttribute('aria-pressed', s.on !== false);
    const est = s.traco ? `border-top-color:${s.cor}` : `background:${s.cor}`;
    b.innerHTML = `<i class="sw${s.traco ? ' tr' : ''}" style="${est};${s.traco?'width:16px;border-top-style:dashed':''}"></i>${nx(s.nome)}`;
    if (clicavel) b.onclick = () => { s.on ? st.off.add(s.nome) : st.off.delete(s.nome); desenha(); };
    else b.disabled = true;
    el.appendChild(b);
  });
}

// contagem animada dos números-herói
function contaNumeros() {
  const reduz = matchMedia('(prefers-reduced-motion: reduce)').matches;
  document.querySelectorAll('[data-num]').forEach(el => {
    const alvo = +el.dataset.num, dec = el.dataset.dec ? +el.dataset.dec : (alvo % 1 ? 1 : 0);
    const pre = el.dataset.pre || '', suf = el.dataset.suf || '';
    const fmt = v => el.dataset.moeda
      ? (el.dataset.compacto && Math.abs(alvo) >= 1e6 ? 'R$ ' + nd(v/1e6) + ' mi'
        : dec ? 'R$ ' + v.toLocaleString('pt-BR',{minimumFractionDigits:2,maximumFractionDigits:2}) : moeda(v))
      : pre + (dec ? nd(v, dec) : ni(v)) + suf;
    if (reduz || !alvo) { el.textContent = fmt(alvo); return; }
    const t0 = performance.now(), dur = 520;
    const passo = t => { const k = Math.min(1, (t - t0)/dur); const e = 1 - Math.pow(1-k, 3);
      el.textContent = fmt(alvo*e); if (k < 1) requestAnimationFrame(passo); };
    requestAnimationFrame(passo);
  });
}

// ---------------------------------------------------------------- dica de instituto
// Passar o mouse no nome mostra quem é a empresa e o que ela registrou no TSE.
// Sem descrição pesquisada, a dica mostra só os números — não inventa perfil.
const PORNOME = new Map(INST.map(x => [x.nm, x]));
function dicaInst(el) {
  const nome = el.dataset.i, inf = infoDe(nome), d = PORNOME.get(nome);
  const cx = $('tip-inst');
  const linhas = d ? `<div class="row"><span>Pesquisas registradas</span><span class="num">${ni(d.qt)}</span></div>`
      + `<div class="row"><span>Para Presidência</span><span class="num">${ni(d.pres)}</span></div>`
      + `<div class="row"><span>Entrevistas</span><span class="num">${ni(d.ent)}</span></div>`
      + `<div class="row"><span>Investimento declarado</span><span class="num">${moeda(d.vr)}</span></div>`
      + `<div class="n">Registros de ${dBR(pd(d.d1))} a ${dBR(pd(d.d2))}${d.al ? ' · ' + ni(d.al) + ' com alerta de qualidade' : ''}</div>`
    : '';
  cx.innerHTML = `<b>${MAI(nome)}</b>`
    + (inf ? `<div class="d">${inf.d}</div><div class="f">fonte: ${inf.f}</div>` : '')
    + (linhas ? `<div class="d" style="margin-top:10px">${linhas}</div>` : '')
    + (inf ? '' : '<div class="f">Sem perfil público verificado. Os números acima vêm do registro obrigatório no TSE.</div>');
  cx.hidden = false;
  const r = el.getBoundingClientRect(), c = cx.getBoundingClientRect();
  let x = r.left, y = r.bottom + 8;
  if (x + c.width > innerWidth - 12) x = innerWidth - c.width - 12;
  if (y + c.height > innerHeight - 12) y = r.top - c.height - 8;
  cx.style.left = Math.max(12, x) + 'px'; cx.style.top = Math.max(12, y) + 'px';
}
document.addEventListener('pointerover', e => {
  const el = e.target.closest && e.target.closest('.qinst');
  if (el) dicaInst(el); else if (!e.target.closest || !e.target.closest('#tip-inst')) $('tip-inst').hidden = true;
});
document.addEventListener('scroll', () => { $('tip-inst').hidden = true; }, true);

// ---------------------------------------------------------------- render
function desenha(soRedesenho) {
  const t1 = st.aba === 't1', t2 = st.aba === 't2';
  // instituto: opções conforme a aba
  const sel = $('sel-inst');
  const fonte = t2 ? [...new Set(D2.map(r => r.i))] : st.aba === 'inst' ? INST.map(x => x.nm) : [...new Set(V1.map(r => r.i))];
  const opcoes = fonte.sort((a,b) => a.localeCompare(b,'pt-BR'));
  if (sel.dataset.aba !== st.aba) {
    bInst.opcoes = opcoes;
    // último dia de campo (1º e 2º turno) ou último registro no TSE (aba Institutos)
    const ult = new Map();
    const guarda = (i, d) => { if (d && (!ult.has(i) || d > ult.get(i))) ult.set(i, d); };
    if (t2) D2.forEach(r => guarda(r.i, r.ds));
    else if (st.aba === 'inst') INST.forEach(x => guarda(x.nm, x.d2));
    else V1.forEach(r => guarda(r.i, r.ds));
    bInst.ult = ult;
    sel.dataset.aba = st.aba;
    // instituto que não pesquisou nesta aba não pode continuar filtrando
    if (st.inst && !opcoes.includes(st.inst)) st.inst = '';
    sel.value = st.inst;
    $('limpa-inst').hidden = !st.inst;
    if (bInst.aberto) listaInst(sel.value);
  }
  sel.title = `${opcoes.length} institutos — digite para filtrar`;
  if (t2) {
    const nomes = [...new Set(D2.flatMap(r => [r.a, r.b]))].sort((a,b) => (SLOT[a]??99)-(SLOT[b]??99));
    if (!st.a || !st.b) { st.a = DUELO_PADRAO[0]; st.b = DUELO_PADRAO[1]; }
    [['sel-a','a'], ['sel-b','b']].forEach(([id, k]) => {
      const s = $(id); if (s.dataset.pronto !== '1') { s.innerHTML = nomes.map(n => `<option value="${n}">${nx(n)}</option>`).join('');
        s.dataset.pronto = '1'; } s.value = st[k]; });
  }
  const av = $('aviso');
  av.innerHTML = st.inst
    ? `Mostrando só <b style="font-weight:600">${MAI(st.inst)}</b>. Os números deixam de ser média entre institutos.`
    : `Sem instituto selecionado: todo percentual é a <b style="font-weight:600">média das pesquisas</b> do período.`;

  const anima = !soRedesenho && !st.animou[st.aba];
  st.animou[st.aba] = true;
  if (t1) painelT1(anima); else if (t2) painelT2(anima);
  else if (st.aba === 'inst') painelInst(anima); else painelProp();
}

// ================================================================ CONTADOR: INICIO
// Bloco substituído pela publicação automática. Duas formas de o contador aparecer:
//
// CONTADOR_HIT   — URL chamada a cada abertura da página. É ela que soma: um acesso por
//                  carregamento, inclusive recarregar.
// CONTADOR_GET   — URL que só lê o total, sem somar. Usada pela tarefa diária que
//                  republica o artifact (se ela usasse a HIT, contaria a si mesma).
//                  As duas só funcionam no site (GitHub Pages): o artifact do claude.ai é
//                  isolado da rede e nenhuma chamada externa sai de lá.
// CONTADOR_TOTAL — número gravado no arquivo na hora de publicar. É assim que o artifact
//                  consegue mostrar contador: a tarefa diária lê o total e escreve aqui.
//                  Fica parado até a próxima publicação — por isso o rótulo muda para
//                  "até <data>" quando o número vem daqui.
//
// Os dois juntos: o site mostra o número vivo, o artifact mostra o do último dia.
// Vazio e zero = sem contador, e o chip nem aparece.
const CONTADOR_HIT   = '__CONTADOR_HIT__';
const CONTADOR_GET   = '__CONTADOR_GET__';
const CONTADOR_TOTAL = __CONTADOR_TOTAL__;
const CONTADOR_DATA  = '__CONTADOR_DATA__';
// ================================================================ CONTADOR: FIM

// ---------------------------------------------------------------- contador de acessos
// Conta ACESSOS: cada vez que a página é aberta ou recarregada soma 1, venha de quem vier.
// Não guarda nada no aparelho de quem visita e não manda nenhum dado pessoal.
// O número gravado (CONTADOR_TOTAL) aparece de imediato; se houver endpoint, a chamada
// viva substitui por um número mais novo. Falha de rede nunca apaga o que já está na tela.
(function () {
  const ligado = !!(CONTADOR_HIT || CONTADOR_GET);
  const mostra = (total, ate) => {
    // com o contador ligado, zero é um número legítimo e aparece: some só quando não há
    // serviço de contagem nenhum configurado
    if (typeof total !== 'number' || total < 0 || (!ligado && total === 0)) return;
    $('contador').hidden = false;
    document.querySelector('.topo').classList.add('com-contador');
    $('contador-n').textContent = ni(total);
    // no estreito o rótulo fica curto para caber no canto; a data continua no title
    const pal = total === 1 ? 'acesso' : 'acessos';
    $('contador-rot').textContent = (ate && innerWidth > 800)
      ? pal + ' até ' + dBR(pd(ate)).slice(0, 5)   // dd/mm; o ano inteiro vai no title
      : pal;
    $('contador').title = ni(total) + (total === 1 ? ' acesso' : ' acessos') + ' ao painel'
      + (ate ? ', número apurado em ' + dBR(pd(ate)) + ' e atualizado uma vez por dia' : '')
      + '. Cada abertura da página conta, inclusive recarregar.'
      + (total === 0 ? ' Ainda em zero: a contagem começa quando o painel estiver publicado no endereço público.' : '');
  };

  mostra(CONTADOR_TOTAL, CONTADOR_DATA);

  if (!CONTADOR_HIT && !CONTADOR_GET) return;

  // todo carregamento soma; sem URL de soma configurada, só lê
  fetch(CONTADOR_HIT || CONTADOR_GET, {cache: 'no-store'})
    .then(r => r.ok ? r.json() : Promise.reject(r.status))
    // serviços diferentes nomeiam o número de formas diferentes
    .then(d => { const n = (typeof d.value === 'number') ? d.value : d.total;
                 if (typeof n === 'number') mostra(n, ''); })
    .catch(function () {});   // contador fora do ar nunca atrapalha o painel
})();

// ---------------------------------------------------------------- ressalva do topo
(function () {
  const nasPesquisas = [...new Set([...V1.map(r => r.nome), ...D2.flatMap(r => [r.a, r.b])])];
  const semRegistro = nasPesquisas.filter(n => !REGISTRADOS.includes(n))
    // ordem alfabética pelo nome exibido, com acento tratado como no português
    .sort((a, b) => nx(a).localeCompare(nx(b), 'pt-BR', {sensitivity: 'base'}));
  const indeferidos = Object.keys(SITUACAO).filter(n => nasPesquisas.includes(n));
  const chave = r => [r.a, r.b].sort().join('|');
  const nDuelos = new Set(D2.filter(r => semRegistro.includes(r.a) || semRegistro.includes(r.b)).map(chave)).size;
  const totDuelos = new Set(D2.map(chave)).size;
  if (!semRegistro.length && !indeferidos.length) { $('ressalva').hidden = true; return; }

  $('ressalva-tit').innerHTML = 'Nem todo nome medido nas pesquisas está na urna — '
    + `<b>${indeferidos.length + semRegistro.length} dos ${nasPesquisas.length}</b> que aparecem aqui não são candidatos hoje.`;

  $('ressalva-corpo').innerHTML =
    (indeferidos.length ? `<h4>Candidatura indeferida</h4>
      ${indeferidos.map(n => `<p><b>${nx(n)}</b> — ${SITUACAO[n].d}</p>`).join('')}
      <p style="margin-top:8px">Os percentuais dele seguem no painel porque foram de fato medidos: referem-se ao período em que ainda estava na disputa. O que mudou é a situação da candidatura, não a pesquisa.</p>` : '')
    + (semRegistro.length ? `<h4>Testados em cenário, sem candidatura registrada</h4>
      <p>Instituto testa nome que pode vir a disputar. Estes apareceram em simulação de 2º turno mas não protocolaram registro no TSE até o prazo de 15/08/2026 — <b>${nDuelos} dos ${totDuelos}</b> confrontos do painel envolvem pelo menos um deles. Os números são reais; o cenário é que é hipotético.</p>
      <div class="nomes">${semRegistro.map(n => `<span>${nx(n)}</span>`).join('')}</div>` : '')
    + '<p style="margin-top:12px" class="nota">Situação conferida no DivulgaCandContas do TSE. Candidatura pode mudar de status até a votação.</p>';
})();

// ---------------------------------------------------------------- carimbos
(function () {
  const carga = new Date(CARGA_UTC);
  const horas = (Date.now() - carga)/36e5, velho = horas > 30;
  const dh = carga.toLocaleString('pt-BR', {day:'2-digit', month:'2-digit', year:'numeric', hour:'2-digit', minute:'2-digit'});
  const idade = horas < 1 ? 'agora há pouco' : horas < 24 ? 'há ' + Math.round(horas) + ' h'
    : 'há ' + Math.round(horas/24) + ' dia' + (Math.round(horas/24) > 1 ? 's' : '');
  $('carimbo').classList.toggle('velho', velho);
  $('carimbo-txt').innerHTML = velho ? `<b>Dado desatualizado</b> — última carga ${idade}`
    : `Dados da carga de <b>${dh}</b> (${idade})`;

  // A previsão sai do INÍCIO de campo, não do fim: é a data em que o instituto foi a
  // campo, e é o intervalo entre inícios que descreve o ritmo de divulgação.
  const ini = pd(CAMPO_INICIO), fim = pd(CAMPO_MAIS_RECENTE);
  const passo = Math.max(1, CADENCIA_DIAS);
  const prox = new Date(ini.getTime() + passo*864e5);
  const periodo = +ini === +fim ? dBR(fim) : `${dBR(ini)} a ${dBR(fim)}`;
  $('proxima').innerHTML = `Campo mais recente <b>${periodo}</b> · próxima prevista <b>${dBR(prox)}</b>`;
  $('proxima').title = `Entre um início de campo e o seguinte passam ${passo} dia${passo>1?'s':''}, `
    + 'na mediana dos últimos 120 dias. A previsão é o último início + esse intervalo.';

  const hoje = new Date(); hoje.setHours(0,0,0,0);
  const dias = Math.round((new Date('2026-10-04T00:00:00') - hoje)/864e5);
  $('prazo').innerHTML = dias > 0 ? `<b>${dias}</b> dias para o 1º turno` : '1º turno em 04/10/2026';
})();

addEventListener('resize', () => { clearTimeout(rt); rt = setTimeout(() => desenha(true), 150); });

aplicaTema(le('tema') || 'auto');
aplicaPaleta(le('paleta') || 'conv');
trocaAba('t1');
