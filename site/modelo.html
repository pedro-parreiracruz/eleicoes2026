<title>Corrida Presidencial 2026</title>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Archivo:wght@400;500;600;700&family=IBM+Plex+Mono:wght@400;500;600&display=swap">
<style>
  /* ============================================================
     Escala de espaçamento 4/8/12/16/24/32/48 — nada fora dela.
     Raio 2px em tudo: campo, cartão, barra. Dado quer canto reto.
     ============================================================ */
  :root {
    color-scheme: light;
    --texto: "Archivo", system-ui, -apple-system, "Segoe UI", sans-serif;
    --numero: "IBM Plex Mono", ui-monospace, SFMono-Regular, Menlo, monospace;

    --e1: 4px;  --e2: 8px;  --e3: 12px; --e4: 16px; --e5: 24px; --e6: 32px; --e7: 48px;
    --r: 2px;
    --alt-campo: 32px;   /* altura única de toda caixa da linha de filtro */

    --plane:    #f4f4f1;
    --surface:  #fcfcfb;
    --sunken:   #f7f7f4;
    --ink:      #0b0b0b;
    --ink-2:    #52514e;
    --muted:    #898781;
    --grid:     #e6e5de;
    --axis:     #c3c2b7;
    --hair:     rgba(11,11,11,0.09);
    --chip:     rgba(11,11,11,0.045);
    --realce:   rgba(5,89,210,0.07);
    --realce-op:#ebf1f8; --hover-op:#f1f1f0;
    --ok:       #0ca30c;
    --warn:     #b07800;
    --focus:    #0559d2;

    --c1:#0559d2; --c2:#954d05; --c3:#047745; --c4:#989401; --c5:#aa0588; --c6:#0b9dcb; --c7:#956fff; --c8:#e4275c;
  }
  :root[data-paleta="cvd"] {
    --c1:#a78e11; --c2:#1299de; --c3:#aa0588; --c4:#7334cf; --c5:#07a786; --c6:#9e4502;
    --focus:#1299de; --realce: rgba(18,153,222,0.08);
  }
  @media (prefers-color-scheme: dark) {
    :root:not([data-tema="claro"]) {
      color-scheme: dark;
      --plane:#0d0d0d; --surface:#1a1a19; --sunken:#151514;
      --ink:#ffffff; --ink-2:#cfcec6; --muted:#a5a39b;
      --grid:#2c2c2a; --axis:#3d3d3a; --hair:rgba(255,255,255,0.10); --chip:rgba(255,255,255,0.06);
      --realce: rgba(7,102,238,0.14); --realce-op:#172537; --hover-op:#282826;
      --ok:#25c025; --warn:#fab219; --focus:#0766ee;
      --c1:#0766ee; --c2:#a95a0d; --c3:#0d8750; --c4:#9b980b; --c5:#bd2099; --c6:#15a0ce; --c7:#9875fd; --c8:#f63d6b;
    }
    :root:not([data-tema="claro"])[data-paleta="cvd"] {
      --c1:#ab9104; --c2:#069ce4; --c3:#bd2099; --c4:#8146e0; --c5:#13aa89; --c6:#b2510c;
      --focus:#069ce4; --realce: rgba(6,156,228,0.12);
    }
  }
  :root[data-tema="escuro"] {
    color-scheme: dark;
    --plane:#0d0d0d; --surface:#1a1a19; --sunken:#151514;
    --ink:#ffffff; --ink-2:#cfcec6; --muted:#a5a39b;
    --grid:#2c2c2a; --axis:#3d3d3a; --hair:rgba(255,255,255,0.10); --chip:rgba(255,255,255,0.06);
    --realce: rgba(7,102,238,0.14); --realce-op:#172537; --hover-op:#282826;
    --ok:#25c025; --warn:#fab219; --focus:#0766ee;
    --c1:#0766ee; --c2:#a95a0d; --c3:#0d8750; --c4:#9b980b; --c5:#bd2099; --c6:#15a0ce; --c7:#9875fd; --c8:#f63d6b;
  }
  :root[data-tema="escuro"][data-paleta="cvd"] {
    --c1:#ab9104; --c2:#069ce4; --c3:#bd2099; --c4:#8146e0; --c5:#13aa89; --c6:#b2510c;
    --focus:#069ce4; --realce: rgba(6,156,228,0.12);
  }

  body { background: var(--plane); color: var(--ink); font-family: var(--texto);
         font-size: 14.5px; line-height: 1.5; }
  .wrap { max-width: 1160px; margin: 0 auto; padding-inline: 20px; padding-block: var(--e6) var(--e7); }

  /* ---------- cabeçalho ---------- */
  .topo { position: relative; display: flex; flex-wrap: wrap; gap: var(--e4); align-items: flex-start; justify-content: space-between; }
  /* o título encolhe e deixa os chips quebrarem dentro dele; senão a coluna cresce até
     a largura dos chips numa linha só e empurra os botões de tema para baixo */
  .topo > :first-child { flex: 1 1 520px; min-width: 0; }
  .temas { flex: none; }
  .eyebrow { font-family: var(--numero); font-size: 11px; letter-spacing: .12em; text-transform: uppercase;
             color: var(--muted); margin: 0 0 var(--e2); }
  h1 { font-size: clamp(25px, 4.5vw, 36px); line-height: 1.08; margin: 0; font-weight: 700; letter-spacing: -0.035em; }
  .lede { color: var(--ink-2); margin: var(--e2) 0 0; }
  @media (min-width: 760px) { .lede, footer p { white-space: nowrap; } }

  .chips { display: flex; flex-wrap: wrap; gap: var(--e2); margin-top: var(--e3); }
  .chip { display: inline-flex; align-items: center; gap: var(--e2); font-size: 12.5px; color: var(--ink-2);
          background: var(--chip); border-radius: var(--r); padding: 5px 10px; }
  .chip .dot { width: 7px; height: 7px; border-radius: 50%; flex: none; background: var(--ok); }
  .chip.velho .dot { background: var(--warn); }
  .chip b { font-family: var(--numero); font-weight: 500; letter-spacing: -0.01em; color: var(--ink); }

  .temas { display: flex; flex-direction: column; gap: var(--e2); align-items: flex-end; }
  /* contador de alcance: só aparece quando há serviço de contagem configurado */
  .contador { display: inline-flex; align-items: baseline; gap: 6px;
              background: var(--chip); border-radius: var(--r); padding: 4px 9px; }
  /* No estreito o cabeçalho empilha e os botões de tema descem — o contador, não:
     ele sai do fluxo e fica grudado no canto superior direito, que é onde se procura
     por ele. A reserva no olho-de-boi impede que os dois se sobreponham. */
  @media (max-width: 800px) {
    .contador { position: absolute; top: 0; right: 0; }
    .topo.com-contador .eyebrow { padding-right: 112px; }
  }
  .contador .n { font-family: var(--numero); font-weight: 600; font-size: 15px;
                 letter-spacing: -.02em; color: var(--ink); }
  .contador .rot { font-family: var(--numero); font-size: 10px; letter-spacing: .07em;
                   text-transform: uppercase; color: var(--muted); }
  .seg { display: flex; background: var(--chip); border-radius: var(--r); padding: 2px; gap: 2px; align-items: stretch; }
  .seg button { font: inherit; font-size: 12.5px; border: 0; background: transparent; color: var(--ink-2);
                padding: 5px 11px; border-radius: var(--r); cursor: pointer; white-space: nowrap; }
  .seg button[aria-pressed="true"] { background: var(--surface); color: var(--ink); font-weight: 600; }

  /* ---------- ressalva do topo ----------
     Fechada por padrão: ocupa uma linha e não empurra gráfico nenhum. Aberta, explica. */
  .ressalva { margin-top: var(--e4); border: 1px solid var(--hair); border-left: 2px solid var(--warn);
              border-radius: var(--r); background: rgba(176,120,0,.08); }
  .ressalva summary { display: flex; align-items: flex-start; gap: var(--e2); padding: var(--e2) var(--e3);
                      cursor: pointer; font-size: 13px; line-height: 1.45; color: var(--ink); list-style: none; }
  .ressalva summary::-webkit-details-marker { display: none; }
  .ressalva .sinal { color: var(--warn); flex: none; }
  .ressalva .mais { margin-left: auto; font-family: var(--numero); font-size: 11px; color: var(--muted);
                    text-transform: uppercase; letter-spacing: .06em; flex: none; }
  .ressalva[open] .mais::after { content: ' \25B4'; }
  .ressalva:not([open]) .mais::after { content: ' \25BE'; }
  /* o texto usa a largura inteira da caixa: com limite em ch ele quebrava na metade
     e deixava a outra metade vazia */
  .ressalva > div { padding: 0 var(--e3) var(--e3); font-size: 12.5px; color: var(--ink-2); line-height: 1.55; }
  .ressalva h4 { margin: var(--e3) 0 var(--e1); font-size: 11px; letter-spacing: .07em;
                 text-transform: uppercase; color: var(--ink); font-weight: 700; }
  .ressalva p { margin: 0; }
  .ressalva .nomes { margin-top: var(--e2); display: flex; flex-wrap: wrap; gap: var(--e1) var(--e2); }
  .ressalva .nomes span { font-size: 12px; background: var(--chip); border-radius: var(--r); padding: 2px 7px; }

  /* ---------- abas ---------- */
  /* rola de lado no celular, mas sem desenhar barra: no Windows ela aparecia sempre
     e ainda criava uma barra vertical de 1px de sobra */
  .abas { display: flex; gap: var(--e1); margin: var(--e6) 0 0; border-bottom: 1px solid var(--hair);
          overflow-x: auto; overflow-y: hidden; scrollbar-width: none; -ms-overflow-style: none; }
  .abas::-webkit-scrollbar { display: none; }
  .abas button { font: inherit; font-size: 14px; font-weight: 500; border: 0; background: none; color: var(--muted);
                 padding: var(--e3) var(--e4); cursor: pointer; white-space: nowrap;
                 border-bottom: 2px solid transparent; margin-bottom: -1px; }
  .abas button[aria-selected="true"] { color: var(--ink); border-bottom-color: var(--c1); }
  .abas button:hover { color: var(--ink-2); }
  @media (max-width: 430px) { .abas button { padding-left: 6px; padding-right: 6px; font-size: 13px; } }

  /* ---------- filtros ---------- */
  /* rótulos de todos os campos na mesma linha: alinha pelo topo, não pela base */
  .filtros { display: flex; flex-wrap: wrap; gap: var(--e3) var(--e5); align-items: flex-start;
             padding: var(--e4) 0 0; }
  [hidden] { display: none !important; }
  .campo { display: flex; flex-direction: column; gap: var(--e1); min-width: 0; max-width: 100%; }
  .campo > label, .rotulo { font-family: var(--numero); font-size: 10.5px; letter-spacing: .08em;
                            text-transform: uppercase; color: var(--muted); }
  .datas { display: flex; align-items: center; gap: var(--e2); flex-wrap: wrap; }
  /* toda caixa da linha de filtro tem a mesma altura — o seletor de data traz altura
     própria do navegador, então a altura é fixada e não deixada para o padding decidir */
  input[type="date"], select, .busca input, .atalhos button, .seg { height: var(--alt-campo); box-sizing: border-box; }
  input[type="date"], select, .busca input { font: inherit; font-size: 13px; color: var(--ink); background: var(--surface);
      border: 1px solid var(--hair); border-radius: var(--r); padding: 0 8px; min-width: 0; max-width: 100%; }
  select { max-width: min(100%, 244px); text-overflow: ellipsis; }
  #sel-a, #sel-b { max-width: min(100%, 176px); }
  .datas span { color: var(--muted); font-size: 13px; }

  /* ---------- campo de busca (instituto) ----------
     São 220 institutos na aba do TSE: rolar um select nativo até "Veritá" é sofrimento.
     Aqui o campo é um input que filtra a lista enquanto se digita, com teclado completo. */
  .busca { position: relative; display: flex; align-items: center; max-width: min(100%, 244px); }
  .busca { width: 244px; }
  .busca input { flex: 1; min-width: 0; padding-right: 26px; outline-offset: 2px; }
  .busca input:hover { border-color: var(--axis); }
  .busca input::placeholder { color: var(--muted); opacity: 1; text-transform: none; }
  #sel-inst, .busca li { text-transform: uppercase; }
  #limpa-inst { position: absolute; right: 4px; top: 50%; transform: translateY(-50%);
      width: 18px; height: 18px; display: grid; place-items: center; font: inherit; font-size: 15px;
      line-height: 1; border: 0; border-radius: var(--r); background: transparent; color: var(--muted);
      cursor: pointer; padding: 0; }
  #limpa-inst:hover { background: var(--chip); color: var(--ink); }
  .busca ul { position: absolute; top: calc(100% + 2px); left: 0; right: 0; z-index: 40;
      margin: 0; padding: var(--e1) 0; list-style: none; max-height: 264px; overflow-y: auto;
      background: var(--surface); border: 1px solid var(--hair); border-radius: var(--r);
      box-shadow: 0 8px 24px rgba(0,0,0,.16); }
  .busca li { padding: 6px 10px; font-size: 13px; color: var(--ink-2); cursor: pointer;
      white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
  .busca li[aria-selected="true"] { color: var(--ink); font-weight: 600; }
  .busca li.ativo { background: var(--realce); color: var(--ink); }
  .busca li mark { background: none; color: var(--ink); font-weight: 600; }
  .busca li { display: flex; align-items: baseline; gap: 8px; }
  .busca li .nm { min-width: 0; overflow: hidden; text-overflow: ellipsis; }
  .busca li .ult { flex: none; margin-left: auto; font-family: var(--numero); font-size: 11.5px;
                   color: var(--muted); text-transform: none; }
  .busca li.vazio { color: var(--muted); cursor: default; font-style: italic; }
  .busca li.todos { border-bottom: 1px solid var(--hair); margin-bottom: var(--e1); padding-bottom: 8px; }
  .atalhos { display: flex; gap: var(--e1); }
  .atalhos button { font: inherit; font-size: 12px; border: 1px solid var(--hair); background: var(--surface);
      color: var(--ink-2); padding: 0 10px; border-radius: var(--r); cursor: pointer; }
  .atalhos button:hover { border-color: var(--axis); color: var(--ink); }
  :is(button, input, select, a):focus-visible { outline: 2px solid var(--focus); outline-offset: 2px; }

  .aviso { display: block; margin-top: var(--e4); padding: var(--e2) var(--e3); line-height: 1.5;
           background: var(--realce); border-left: 2px solid var(--c1); border-radius: var(--r);
           font-size: 12.5px; color: var(--ink-2); }

  /* ---------- cartões ---------- */
  .tiles { display: grid; grid-template-columns: repeat(auto-fit, minmax(158px, 1fr)); gap: 1px;
           background: var(--hair); border: 1px solid var(--hair); border-radius: var(--r);
           overflow: hidden; margin-top: var(--e5); }
  .tile { background: var(--surface); padding: var(--e4) var(--e4) var(--e3); }
  .tile .k { font-family: var(--numero); font-size: 10.5px; letter-spacing: .08em; text-transform: uppercase; color: var(--ink-2); }
  .tile .v { font-family: var(--numero); font-weight: 600; font-size: 28px; line-height: 1.12; white-space: nowrap;
             margin-top: var(--e2); letter-spacing: -0.035em; }
  .tile .s { font-size: 12.5px; color: var(--ink-2); margin-top: var(--e1); }

  .card { background: var(--surface); border: 1px solid var(--hair); border-radius: var(--r);
          padding: var(--e5) var(--e4) var(--e4); margin-top: var(--e5); }
  .card h2 { font-size: 13.5px; margin: 0; letter-spacing: .07em; font-weight: 700;
             text-transform: uppercase; color: var(--ink); }
  .card .sub { font-size: 12.5px; color: var(--ink-2); margin: var(--e1) 0 0; }
  .card-topo { display: flex; flex-wrap: wrap; gap: var(--e2) var(--e4); align-items: baseline;
               justify-content: space-between; margin-bottom: var(--e5); }
  .card-acoes { display: flex; gap: var(--e2); align-items: center; }

  /* legendas centralizadas sob o gráfico, inclusive quando quebram linha */
  .legenda { display: flex; flex-wrap: wrap; justify-content: center; gap: var(--e1) var(--e4); margin-top: var(--e4); }
  .legenda button { display: inline-flex; align-items: center; gap: 7px; font: inherit; font-size: 12.5px;
      background: none; border: 0; padding: var(--e1) 2px; cursor: pointer; color: var(--ink-2); border-radius: var(--r); }
  .legenda button[aria-pressed="false"] { opacity: .35; }
  .sw { width: 10px; height: 10px; border-radius: var(--r); flex: none; }
  .sw.tr { height: 0; border-top-width: 2.5px; border-top-style: solid; border-radius: 0; }

  .plot { position: relative; background: var(--sunken); border-radius: var(--r); padding: var(--e3) var(--e2) var(--e2); }
  svg { display: block; width: 100%; height: auto; overflow: visible; }
  .tick { font-family: var(--numero); font-size: 11.5px; fill: var(--muted); }
  .catlabel { font-family: var(--texto); font-size: 13px; fill: var(--ink-2); }
  /* diferença em destaque: é a resposta que a dica existe para dar */
  .tip .dif { margin-top: 8px; padding: 7px 9px; border-radius: var(--r); background: var(--chip);
             font-size: 12px; color: var(--ink-2); display: grid; gap: 3px; }
  .tip .dif-l .v { font-size: 14px; }
  /* fora da urna: ⚠ + sublinhado amarelo, no gráfico e na dica */
  .catlabel .fora { fill: var(--warn); text-decoration: underline; text-decoration-color: var(--warn);
                    text-underline-offset: 3px; }
  .tip .fora { color: var(--warn); text-decoration: underline; text-decoration-color: var(--warn);
              text-underline-offset: 3px; }
  .tip .fora-nota { display: flex; gap: 6px; margin-top: 7px; font-size: 11.5px; line-height: 1.4;
                   color: var(--ink-2); max-width: 280px; }
  .tip .fora-nota > span:first-child { color: var(--warn); flex: none; }
  .tip .fora-nota b { display: inline; text-transform: none; letter-spacing: 0; color: var(--ink); font-size: inherit; margin: 0; }
  .tip .dif-l { display: flex; justify-content: space-between; gap: 14px; }
  .tip .dif-l .v { font-family: var(--numero); color: var(--ink); font-weight: 600; white-space: nowrap; }
  .catlabel.alerta { fill: var(--warn); }
  .aviso.alerta { background: rgba(176,120,0,.10); border-left-color: var(--warn); margin-bottom: var(--e4); }
  .vallabel { font-family: var(--numero); font-size: 12px; font-weight: 500; fill: var(--ink); }
  .endlabel { font-size: 12.5px; }
  .endlabel .nm { font-family: var(--texto); }
  .endlabel .vl { font-family: var(--numero); font-weight: 500; }
  .avatar-txt { font-family: var(--texto); font-size: 10px; font-weight: 700; fill: #fff; }

  .tip { position: absolute; pointer-events: none; z-index: 5; opacity: 0; transition: opacity .12s;
         background: var(--surface); border: 1px solid var(--hair); border-radius: var(--r);
         box-shadow: 0 8px 24px rgba(0,0,0,.16); padding: var(--e3); font-size: 12.5px; min-width: 156px; }
  .tip b { display: block; font-size: 11.5px; color: var(--muted); font-weight: 500; letter-spacing: .04em;
           text-transform: uppercase; margin-bottom: var(--e2); }
  .tip .row { display: flex; align-items: center; gap: var(--e2); justify-content: space-between; margin-top: 3px; }
  .tip .row span { display: inline-flex; align-items: center; gap: 6px; }
  .tip .num { font-family: var(--numero); font-size: 12.5px; }
  .tip .n { color: var(--muted); font-size: 11.5px; margin-top: var(--e2); padding-top: var(--e2); border-top: 1px solid var(--hair); }

  /* ---------- tabelas ---------- */
  .tabwrap { overflow: auto; max-height: 560px; margin-top: var(--e3); border: 1px solid var(--hair); border-radius: var(--r); }
  table { border-collapse: separate; border-spacing: 0; width: 100%; font-size: 13.5px; font-family: var(--numero); }
  th, td { text-align: right; padding: var(--e2) var(--e3); border-bottom: 1px solid var(--hair); white-space: nowrap; }
  thead th { position: sticky; top: 0; z-index: 2; background: var(--sunken); font-family: var(--texto);
             font-size: 10.5px; letter-spacing: .06em; text-transform: uppercase; color: var(--muted);
             font-weight: 600; cursor: pointer; user-select: none; }
  thead th:hover { color: var(--ink); }
  th:first-child, td:first-child { text-align: left; font-family: var(--texto);
      position: sticky; left: 0; z-index: 1; background: var(--surface);
      max-width: min(230px, 42vw); overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
  thead th:first-child { z-index: 3; background: var(--sunken); }
  tbody tr:hover td { background: var(--chip); }
  /* a primeira coluna é sticky: fundo translúcido deixaria o conteúdo rolado
     aparecer por baixo dela. Aqui ela usa sempre cor sólida. */
  tbody tr:hover td:first-child { background: var(--hover-op); }
  td.ord, th.ord { background: var(--realce); }
  tbody tr:hover td.ord { background: var(--realce); }
  td:first-child.ord, th:first-child.ord { background: var(--realce-op); }
  tbody tr:hover td:first-child.ord { background: var(--realce-op); }
  th.ord::after { content: " \25BC"; font-size: 8px; }
  th.ord.asc::after { content: " \25B2"; }
  .celcand { display: inline-flex; align-items: center; gap: var(--e2); }
  .celduelo { display: inline-flex; align-items: center; gap: 6px; white-space: nowrap; vertical-align: middle; }
  .celduelo .x { color: var(--muted); }
  .celduelo .fora { color: var(--warn); text-decoration: underline; text-decoration-color: var(--warn);
                    text-underline-offset: 3px; }
  /* avatar: foto quando existe, monograma quando não. O anel mantém a cor da série —
     a foto diz quem é, a cor continua ligando a pessoa à linha e à barra do gráfico. */
  .cand-av { display: inline-block; width: 16px; height: 16px; border-radius: 50%; flex: none; }
  img.cand-av { object-fit: cover; box-shadow: 0 0 0 1.5px var(--anel); }

  /* .tip nasce com opacity 0 (os gráficos acendem via JS); este é controlado por hidden */
  #tip-inst { position: fixed; max-width: 330px; min-width: 240px; z-index: 60; opacity: 1; }
  #tip-inst .d { color: var(--ink-2); line-height: 1.45; margin-top: var(--e2); }
  #tip-inst .f { color: var(--muted); font-size: 11.5px; margin-top: var(--e2); }
  .qinst { cursor: help; border-bottom: 1px dotted var(--axis); }
  .qinst.sem { border-bottom-style: none; cursor: default; }

  .tema { margin-top: var(--e5); }
  .tema:first-child { margin-top: var(--e3); }

const chaveInst = t => semAcento(String(t)).toLowerCase().replace(/[^a-z0-9]+/g, ' ');
const _cacheInfo = new Map();
function infoDe(nome) {
  if (_cacheInfo.has(nome)) return _cacheInfo.get(nome);
  const c = ' ' + chaveInst(nome) + ' ';
  // vence a chave mais longa: evita "vox" ganhar de "vox brasil"
  let achado = null, tam = -1;
  for (const e of INFO_INST) for (const k of e.k)
    // palavra inteira: "verita" não casa com "veritas", "ideia" não casa com "boas ideias"
    if (c.includes(' ' + k + ' ') && k.length > tam) { achado = e; tam = k.length; }
  _cacheInfo.set(nome, achado); return achado;
}

const PARTIDO = {}; V1.forEach(r => { PARTIDO[r.nome] = r.part; });
D2.forEach(r => { if (!(r.a in PARTIDO)) PARTIDO[r.a] = ''; if (!(r.b in PARTIDO)) PARTIDO[r.b] = ''; });

// Cor por candidato: lista fixa, escrita à mão. Antes a ordem saía da média das
// pesquisas, então quem subia ou descia trocava de cor de uma carga para a outra.
// Aqui o nome manda: o candidato tem a mesma cor em toda a página, em toda aba, hoje
// e na semana que vem. Nome novo entra depois da lista, em ordem alfabética estável.
const ORDEM_FIXA = [
  'Lula', 'Flávio Bolsonaro', 'Cury (Avante)', 'Renan Santos', 'Ronaldo Caiado',
  'Pablo Marçal', 'Romeu Zema', 'Tarcísio de Freitas', 'Michelle Bolsonaro',
  'Ratinho Júnior', 'Jair Bolsonaro', 'Eduardo Leite', 'Eduardo Bolsonaro',
  'Fernando Haddad', 'Ciro Gomes', 'Aldo Rebelo', 'Tereza Cristina', 'Aécio Neves',
  'Rogério Marinho', 'Ciro Nogueira', 'Barbosa (DC)', 'Lima (Sem partido)',
  'Samara', 'Pimenta', 'Dias', 'Clariana', 'Costa', 'Grassi'
];
const SLOT = {};
ORDEM_FIXA.forEach((n, i) => { SLOT[n] = i; });
[...new Set([...V1.map(r => r.nome), ...D2.flatMap(r => [r.a, r.b])])]
  .filter(n => !(n in SLOT)).sort((a, b) => a.localeCompare(b, 'pt-BR'))
  .forEach(n => { SLOT[n] = Object.keys(SLOT).length; });

// Quantas cores exclusivas cada paleta comporta. Não é escolha de gosto: acima disso
// dois candidatos ficam indistinguíveis (ΔE abaixo do piso), e aí vale mais repetir a
// cor com traço/hachura diferente do que fingir que são cores distintas.
const N_SLOTS = () => document.documentElement.getAttribute('data-paleta') === 'cvd' ? 6 : 8;
// o gráfico de linhas continua limitado: 8 séries no mesmo eixo viram espaguete
const N_LINHAS = () => document.documentElement.getAttribute('data-paleta') === 'cvd' ? 5 : 6;
const corDe = nome => css('--c' + ((SLOT[nome] % N_SLOTS()) + 1));
// Há mais candidatos do que matizes seguras — passado o último slot, a cor se repete.
// O ciclo diz quantas voltas o nome deu: 0 = cor exclusiva, 1+ = cor emprestada, e aí
// entra a segunda codificação (traço na linha, hachura na barra).
const ciclo = nome => Math.floor((SLOT[nome] ?? 0) / N_SLOTS());
const TRACOS = ['', '7 3', '2 3', '10 3 2 3', '4 2', '1 3'];
const TRACOS_CICLO = ['', '7 3', '2 3', '10 3 2 3'];
const tracoDe = nome => document.documentElement.getAttribute('data-paleta') === 'cvd'
  ? TRACOS[SLOT[nome] % TRACOS.length]
  : TRACOS_CICLO[Math.min(ciclo(nome), TRACOS_CICLO.length - 1)];

const DUELOS = (() => { const m = new Map();
  D2.forEach(r => { const k = [r.a, r.b].sort().join('||'); const a = m.get(k) || {p:[r.a,r.b].sort(), n:0};
    a.n++; m.set(k, a); });
  return [...m.values()].sort((x,y) => y.n - x.n); })();

// Duelo padrão: os dois nomes mais simulados no 2º turno — se eles se enfrentam
// em algum cenário; senão, o confronto com mais simulações.
const DUELO_PADRAO = (() => {
  const c = new Map();
  D2.forEach(r => { c.set(r.a, (c.get(r.a)||0)+1); c.set(r.b, (c.get(r.b)||0)+1); });
  const top = [...c.entries()].sort((x,y) => y[1]-x[1]).slice(0, 2).map(x => x[0]);
  return DUELOS.some(d => d.p.join('||') === top.slice().sort().join('||')) ? top : DUELOS[0].p;
})();

const LIM = {
  t1: [V1.reduce((a,r) => r.d < a ? r.d : a, V1[0].d), V1.reduce((a,r) => r.d > a ? r.d : a, V1[0].d)],
  t2: [D2.reduce((a,r) => r.d < a ? r.d : a, D2[0].d), D2.reduce((a,r) => r.d > a ? r.d : a, D2[0].d)]
};

function limites() { return st.aba === 't2' ? LIM.t2 : st.aba === 't1' ? LIM.t1 : LIM.t2; }

// ---------------------------------------------------------------- busca de instituto
// Combobox de verdade (não um select disfarçado): digita para filtrar, setas para andar,
// Enter escolhe, Esc desfaz. Sem escolha = "Todos (média)", que é o estado padrão.
const bInst = {opcoes: [], filtradas: [], aberto: false, ativo: -1, ult: new Map()};
const TODOS = 'Todos (média)';
const semCaixa = t => semAcento(t).toLowerCase();
const escapaHTML = t => t.replace(/[&<>"]/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));

function realcaTrecho(nome, termo) {
  if (!termo) return escapaHTML(nome);
  const i = semCaixa(nome).indexOf(semCaixa(termo));
  if (i < 0) return escapaHTML(nome);
  return escapaHTML(nome.slice(0, i)) + '<mark>' + escapaHTML(nome.slice(i, i + termo.length))
       + '</mark>' + escapaHTML(nome.slice(i + termo.length));
}

function listaInst(termo) {
  const t = semCaixa(termo.trim());
  bInst.filtradas = t ? bInst.opcoes.filter(o => semCaixa(o).includes(t)) : bInst.opcoes.slice();
  const ul = $('lista-inst');
  const itens = [];
  // "Todos" só some quando o texto digitado não combina com ele
  if (!t || semCaixa(TODOS).includes(t))
    itens.push(`<li class="todos" role="option" data-v="" aria-selected="${!st.inst}">${TODOS}</li>`);
  // ao lado do nome, o último dia de campo do instituto nesta aba: mostra quem está em dia
  bInst.filtradas.forEach(o => {
    const u = bInst.ult.get(o);
    const dt = u ? `<span class="ult" title="Última pesquisa: ${dBR(pd(u))}">(${u.slice(8,10)}/${u.slice(5,7)}/${u.slice(2,4)})</span>` : '';
    itens.push(`<li role="option" data-v="${escapaHTML(o)}" aria-selected="${o === st.inst}">`
      + `<span class="nm">${realcaTrecho(o, termo.trim())}</span>${dt}</li>`);
  });
  if (!itens.length) itens.push('<li class="vazio">Nenhum instituto com esse nome</li>');
  ul.innerHTML = itens.join('');
  bInst.ativo = -1;
}

function abreInst(termo) {
  listaInst(termo === undefined ? '' : termo);
  $('lista-inst').hidden = false;
  $('sel-inst').setAttribute('aria-expanded', 'true');
  bInst.aberto = true;
}

function fechaInst() {
  $('lista-inst').hidden = true;
  $('sel-inst').setAttribute('aria-expanded', 'false');
  bInst.aberto = false; bInst.ativo = -1;
  $('sel-inst').value = st.inst;          // texto solto não vira filtro
  $('limpa-inst').hidden = !st.inst;
}

function marcaAtivo(i) {
  const itens = [...$('lista-inst').querySelectorAll('li:not(.vazio)')];
  if (!itens.length) return;
  bInst.ativo = (i + itens.length) % itens.length;
  itens.forEach((el, k) => el.classList.toggle('ativo', k === bInst.ativo));
  itens[bInst.ativo].scrollIntoView({block: 'nearest'});
}

function escolheInst(valor) {
  st.inst = valor;
  fechaInst();
  desenha();
}

$('sel-inst').addEventListener('input', e => abreInst(e.target.value));
$('sel-inst').addEventListener('focus', () => { $('sel-inst').select(); abreInst(''); });
$('sel-inst').addEventListener('keydown', e => {
  if (e.key === 'ArrowDown' || e.key === 'ArrowUp') {
    e.preventDefault();
    if (!bInst.aberto) return abreInst($('sel-inst').value);
    marcaAtivo(bInst.ativo + (e.key === 'ArrowDown' ? 1 : -1));
  } else if (e.key === 'Enter') {
    e.preventDefault();
    const itens = [...$('lista-inst').querySelectorAll('li:not(.vazio)')];
    // sem item destacado, Enter aceita a única opção que sobrou do filtro
    const alvo = bInst.ativo >= 0 ? itens[bInst.ativo] : (itens.length === 1 ? itens[0] : null);
    if (alvo) escolheInst(alvo.dataset.v);
  } else if (e.key === 'Escape') {
    if (bInst.aberto) { e.stopPropagation(); fechaInst(); }
  } else if (e.key === 'Tab') {
    fechaInst();
  }
});
$('lista-inst').addEventListener('mousedown', e => {   // mousedown: o blur não rouba o clique
  const li = e.target.closest('li[data-v]');
  if (li) { e.preventDefault(); escolheInst(li.dataset.v); }
});
$('sel-inst').addEventListener('blur', () => setTimeout(fechaInst, 0));
$('limpa-inst').addEventListener('click', () => { escolheInst(''); $('sel-inst').focus(); });

function resumo1(rows) {
  const m = new Map();
  rows.forEach(r => { const a = m.get(r.nome) || {nome:r.nome, s:0, n:0, min:Infinity, max:-Infinity, mg:0, mgn:0};
    a.s += r.v; a.n++; a.min = Math.min(a.min, r.v); a.max = Math.max(a.max, r.v);
    const mg = MARGEM.get(r.ds + '|' + r.i); if (mg != null) { a.mg += mg; a.mgn++; }
    m.set(r.nome, a); });
  return [...m.values()].map(a => ({...a, media: a.s/a.n, margem: a.mgn ? a.mg/a.mgn : null}))
    .sort((x,y) => y.media - x.media);
}
function serieDiaria(rows, nomes) {
  const k = new Map();
  rows.forEach(r => { if (!nomes.includes(r.nome)) return;
    const key = r.ds + '|' + r.nome; const a = k.get(key) || {d:r.d, nome:r.nome, s:0, n:0};
    a.s += r.v; a.n++; k.set(key, a); });
  const out = {}; nomes.forEach(n => out[n] = []);
  [...k.values()].sort((a,b) => a.d - b.d).forEach(a => out[a.nome].push({d:a.d, v:a.s/a.n, n:a.n}));
  return out;
}

function avatarSVG(svg, cx, cy, r, nome) {

// Só dá para medir texto SVG depois que ele está no documento. Este passe encurta
// o rótulo até caber e encosta o avatar na primeira letra — nada se sobrepõe.
// Folga entre o avatar e a primeira letra do nome mais longo. Com 6px o avatar parecia
// grudado em nomes compridos ("Rui Costa Pimenta"); 14px separa sem desperdiçar barra.
const AV_FOLGA = 14;
const AV_RESERVA = 12 + 11 * 2 + AV_FOLGA - 12;   // largura que o avatar toma do gutter
function encaixaRotulos(ajustes, padL) {
  const temAv = ajustes.some(a => a.av);
  const espaco = padL - 12 - (temAv ? AV_RESERVA : 4);
  // 1ª passada: encurta o que não cabe
  // encurta pelo fim, pedaço por pedaço: o rótulo pode ter tspans (nome fora da urna
  // com ⚠ e sublinhado) e trocar o textContent inteiro apagaria essa marcação
  ajustes.forEach(({lb}) => {
    if (lb.getComputedTextLength() <= espaco) return;
    const cheio = lb.textContent;
    const partes = [...lb.childNodes];
    for (let k = partes.length - 1; k >= 0 && lb.getComputedTextLength() > espaco; k--) {
      const no = partes[k]; let txt = no.textContent.replace(/…$/, '');
      while (txt.length > 1 && lb.getComputedTextLength() > espaco) {
        txt = txt.slice(0, -1); no.textContent = txt.trimEnd() + '…';
      }
      if (lb.getComputedTextLength() > espaco && k > 0) no.textContent = '';
    }
    const t = svgEl('title', {}); t.textContent = cheio; lb.appendChild(t);
  });
  // 2ª passada: todos os avatares na MESMA coluna. Antes cada um encostava no
  // próprio texto e a coluna saía serrilhada, como se as linhas estivessem tortas.
  const maior = Math.max(0, ...ajustes.map(a => a.lb.getComputedTextLength()));
  // centro do avatar = raio (11) + folga até a 1ª letra do maior nome
  const xAv = Math.max(11, padL - 12 - maior - 11 - AV_FOLGA);
  ajustes.forEach(({av, cy}) => { if (av) av.setAttribute('transform', `translate(${xAv},${cy})`); });
}

// Medir texto antes de desenhar: sem isso a margem da direita é chute e nome grande
// sai cortado ("Flávio Bolsona…"). O canvas usa a mesma fonte do SVG.
const _ctx = document.createElement('canvas').getContext('2d');
function larguraTexto(txt, peso, tam, familia) {
  _ctx.font = `${peso} ${tam}px ${familia}`;
  return _ctx.measureText(txt).width;
}

// ---------------------------------------------------------------- gráfico de linhas
function desenhaLinhas(host, tip, series, opts) {
  [...host.children].forEach(c => { if (c !== tip) c.remove(); });
  const W = Math.max(280, host.clientWidth - 16);
  const estreito = W < 520;
  // margem da direita = o maior rótulo de ponta que realmente vai ser escrito,
  // limitada a 42% da largura para o gráfico não virar um filete
  const fTexto = css('--texto'), fNum = css('--numero');
  const padRot = !estreito ? Math.min(W * 0.42, 14 + 14 + Math.max(0, ...series
        .filter(s => s.on && s.pts.length)
        .map(s => larguraTexto(s.nome, '400', 12.5, fTexto)
                + 6 + larguraTexto(nd(s.pts[s.pts.length-1].v) + '%', '500', 12.5, fNum)))) : 12;
  const padL = 46, padR = Math.ceil(padRot), padT = 12, padB = 34;
  const H = estreito ? 268 : 336;
  const ativos = series.filter(s => s.on && s.pts.length);
  if (!ativos.length) { host.insertAdjacentHTML('beforeend', '<p class="nota">Sem pesquisas no período.</p>'); return; }

  const pts = ativos.flatMap(s => s.pts);
  const t0 = Math.min(...pts.map(p => +p.d)), t1 = Math.max(...pts.map(p => +p.d));
  const vmax = Math.max(...pts.map(p => p.v)), vmin = Math.min(...pts.map(p => p.v));
  const pY = opts.passoY || 5;
  const yT = Math.min(opts.maxY ?? Infinity, Math.ceil((vmax + 2)/pY)*pY),
        yB = opts.minY ?? Math.max(0, Math.floor((vmin - 2)/pY)*pY);
  const X = t => padL + (t1 === t0 ? 0.5 : (t - t0)/(t1 - t0)) * (W - padL - padR);
  const Y = v => padT + (1 - (v - yB)/(yT - yB)) * (H - padT - padB);

  const svg = svgEl('svg', {viewBox: `0 0 ${W} ${H}`, role: 'img'});
  for (let v = yB; v <= yT; v += pY) {
    svg.appendChild(svgEl('line', {x1: padL, x2: W - padR, y1: Y(v), y2: Y(v), stroke: css('--grid'), 'stroke-width': 1}));
    const l = svgEl('text', {x: padL - 10, y: Y(v) + 4, 'text-anchor': 'end', class: 'tick'});
    l.textContent = v + '%'; svg.appendChild(l);
  }
  const nT = estreito ? 2 : 6;
  for (let i = 0; i <= nT; i++) { const t = t0 + (t1 - t0)*i/nT;
    const l = svgEl('text', {x: X(t), y: H - padB + 20, class: 'tick',
      'text-anchor': i === 0 ? 'start' : (i === nT ? 'end' : 'middle')});
    l.textContent = dCurto(new Date(t)); svg.appendChild(l); }
  svg.appendChild(svgEl('line', {x1: padL, x2: W - padR, y1: Y(yB), y2: Y(yB), stroke: css('--axis'), 'stroke-width': 1}));

  const suave = ativos[0].pts.length > 14;
  const mm = p => p.map((x, i) => { const a = Math.max(0, i-2), b = Math.min(p.length-1, i+2);
    let s = 0, n = 0; for (let k = a; k <= b; k++) { s += p[k].v; n++; } return {d:x.d, v:s/n}; });
  const cam = p => p.map((x,i) => (i?'L':'M') + X(+x.d) + ' ' + Y(x.v)).join(' ');

  if (opts.faixa && ativos.length === 2) {
    const A = suave ? mm(ativos[0].pts) : ativos[0].pts, B = suave ? mm(ativos[1].pts) : ativos[1].pts;
    if (A.length === B.length) svg.appendChild(svgEl('path', {
      d: 'M ' + A.map(p => X(+p.d)+','+Y(p.v)).join(' L ') + ' L ' + B.slice().reverse().map(p => X(+p.d)+','+Y(p.v)).join(' L ') + ' Z',
      fill: ativos[0].cor, opacity: .09}));
  }

  const rot = [];
  ativos.forEach((s, idx) => {
    if (suave) svg.appendChild(svgEl('path', {d: cam(s.pts), fill:'none', stroke: s.cor,
      'stroke-width': 1.5, opacity: .2, 'stroke-linejoin':'round'}));
    const linha = suave ? mm(s.pts) : s.pts;
    const p = svgEl('path', {d: cam(linha), fill: 'none', stroke: s.cor, 'stroke-width': 2.2,
      'stroke-linejoin': 'round', 'stroke-linecap': 'round'});
    if (s.traco) p.setAttribute('stroke-dasharray', s.traco);
    if (opts.anima && !s.traco) { p.classList.add('linha-anim');
      p.style.setProperty('--dash', Math.max(1, p.getTotalLength ? 2400 : 2400));
      p.style.animationDelay = (idx * 60) + 'ms'; }
    svg.appendChild(p);
    const u = linha[linha.length - 1];
    svg.appendChild(svgEl('circle', {cx: X(+u.d), cy: Y(u.v), r: 4, fill: s.cor,
      stroke: css('--surface'), 'stroke-width': 2}));
    if (!estreito) rot.push({x: X(+u.d)+10, y: Y(u.v), nome: s.nome,
      val: nd(u.v)+'%', cor: s.cor, v: u.v});
  });
  // rótulos de ponta: maior valor sempre acima, depois afasta o que colidir
  rot.sort((a,b) => b.v - a.v);
  rot.forEach((r,i) => { if (i && r.y - rot[i-1].y < 18) r.y = rot[i-1].y + 18; });
  const ex = rot.length ? rot[rot.length-1].y - (H - padB) : 0;
  if (ex > 0) rot.forEach(r => r.y -= ex);
  rot.forEach(r => {
    svg.appendChild(svgEl('rect', {x: r.x, y: r.y-4.5, width: 9, height: 9, rx: 2, fill: r.cor}));
    const t = svgEl('text', {x: r.x+14, y: r.y+4.5, class: 'endlabel', fill: css('--ink')});
    const a = svgEl('tspan', {class:'nm', fill: css('--ink-2')}); a.textContent = nx(r.nome);
    const b = svgEl('tspan', {class:'vl', dx: 6}); b.textContent = r.val;
    t.appendChild(a); t.appendChild(b); svg.appendChild(t);
  });

  const cruz = svgEl('line', {y1: padT, y2: H - padB, stroke: css('--axis'), 'stroke-width': 1, opacity: 0});
  svg.appendChild(cruz);
  // nascem fora do quadro: em (0,0) elas esticavam a caixa do SVG 4px para a esquerda
  const marcas = ativos.map(s => { const c = svgEl('circle', {cx: -50, cy: -50, r: 4.5, fill: s.cor,
    stroke: css('--surface'), 'stroke-width': 2, opacity: 0}); svg.appendChild(c); return c; });
  const capa = svgEl('rect', {x: padL, y: padT, width: Math.max(1, W-padL-padR), height: H-padT-padB, fill: 'transparent'});
  capa.addEventListener('pointermove', ev => {
    const rc = svg.getBoundingClientRect(); const px = (ev.clientX - rc.left) * (W / rc.width);
    const alvo = t0 + ((px - padL)/(W - padL - padR))*(t1 - t0);
    let melhor = null; ativos[0].pts.forEach(p => { if (!melhor || Math.abs(+p.d-alvo) < Math.abs(+melhor.d-alvo)) melhor = p; });
    const tx = X(+melhor.d);
    cruz.setAttribute('x1', tx); cruz.setAttribute('x2', tx); cruz.setAttribute('opacity', 1);
    const itens = []; let nn = 0;
    ativos.forEach((s,i) => { const p = s.pts.find(q => +q.d === +melhor.d);
      if (p) { nn = Math.max(nn, p.n || 0); marcas[i].setAttribute('cx', X(+p.d)); marcas[i].setAttribute('cy', Y(p.v));
        marcas[i].setAttribute('opacity', 1); itens.push({nome: s.nome, v: p.v, cor: s.cor}); }
      else marcas[i].setAttribute('opacity', 0); });
    dica(tip, host, tx, Y(yT)+30, `<b>${dBR(melhor.d)}</b>${linhasDica(itens)}` +
      (nn ? `<div class="n">${nn} pesquisa${nn>1?'s':''} no dia</div>` : ''));
  });
  capa.addEventListener('pointerleave', () => { cruz.setAttribute('opacity', 0);
    marcas.forEach(m => m.setAttribute('opacity', 0)); semDica(tip); });
  svg.appendChild(capa);
  host.appendChild(svg);
}

// ---------------------------------------------------------------- gráfico de barras
function desenhaBarras(host, tip, dados, opts) {
  [...host.children].forEach(c => { if (c !== tip) c.remove(); });
  const W = Math.max(280, host.clientWidth - 16);
  if (!dados.length) { host.insertAdjacentHTML('beforeend', '<p class="nota">Sem pesquisas no período.</p>'); return; }
  const estreito = W < 520;
  // gutter medido, não chutado: nome de duelo é longo ("Flávio Bolsonaro × Fernando Haddad")
  const rotulos = dados.map(d => opts.par
    ? (() => { const n2 = [[d.a, d.va], [d.b, d.vb]].sort((x, y) => y[1] - x[1]);
               const nm = n => (foraDaUrna(n) ? '⚠ ' : '') + (estreito ? nx(n).split(' ')[0] : nx(n));
               return nm(n2[0][0]) + ' × ' + nm(n2[1][0]); })()
    : nx(d.nome));
  const maiorRot = Math.max(0, ...rotulos.map(t => larguraTexto(t, '400', 13, css('--texto'))));
  // no celular o avatar sai: 30px de gutter valem mais como barra
  const comAvatar = W >= 420;
  const maiorVal = Math.max(0, ...dados.flatMap(d => opts.par ? [d.va, d.vb] : [d.media])
                                       .map(v => larguraTexto(nd(v) + '%', '500', 12, css('--numero'))));
  const padL = Math.min(W * (estreito ? 0.40 : 0.45),
                        Math.ceil(maiorRot) + 12 + (comAvatar ? AV_RESERVA : 4)),
        padR = Math.ceil(maiorVal) + 16, padT = 10, padB = 32;
  const alt = opts.par ? 48 : 36;
  const H = padT + dados.length*alt + padB;
  const topo = Math.ceil(Math.max(10, ...dados.map(d => opts.par ? Math.max(d.va, d.vb) : d.max))/10)*10;
  const X = v => padL + (v/topo)*(W - padL - padR);

  const svg = svgEl('svg', {viewBox: `0 0 ${W} ${H}`, role: 'img'});
  const hid = defsHachura(svg);
  const ajustes = [];
  const passo = estreito ? 20 : 10;
  for (let t = 0; t <= topo; t += passo) {
    svg.appendChild(svgEl('line', {x1: X(t), x2: X(t), y1: padT, y2: H-padB, stroke: css('--grid'), 'stroke-width': 1}));
    const l = svgEl('text', {x: X(t), y: H-padB+19, 'text-anchor':'middle', class:'tick'});
    l.textContent = t + '%'; svg.appendChild(l);
  }

  dados.forEach((d, i) => {
    const y0 = padT + i*alt;
    const g = svgEl('g', {});
    if (opts.anima) { g.classList.add('surge'); g.style.animationDelay = (i*28) + 'ms'; }

    if (opts.par) {
      const nomes = [[d.a, d.va], [d.b, d.vb]].sort((x,y) => y[1] - x[1]);
      const av = comAvatar ? avatarSVG(g, padL - 150, y0 + alt/2 - 1, 11, nomes[0][0]) : null;
      const lb = svgEl('text', {x: padL - 12, y: y0 + alt/2 + 4, 'text-anchor':'end', class:'catlabel'});
      // quem está fora da urna ganha ⚠ e sublinhado amarelo, no rótulo e na dica
      const parte = n => { const t = svgEl('tspan', foraDaUrna(n) ? {class: 'fora'} : {});
        t.textContent = (foraDaUrna(n) ? '⚠ ' : '') + (estreito ? nx(n).split(' ')[0] : nx(n)); return t; };
      lb.appendChild(parte(nomes[0][0]));
      lb.appendChild(document.createTextNode(' × '));
      lb.appendChild(parte(nomes[1][0]));
      g.appendChild(lb);
      ajustes.push({lb, av, cy: y0 + alt/2 - 1});
      const colide = corDe(nomes[0][0]) === corDe(nomes[1][0]);
      nomes.forEach(([nm, vv], j) => {
        // duas barras de 14px separadas por 2px, o par centrado na linha
        const yy = y0 + (alt - (14*2 + 2))/2 + j*(14 + 2);
        const larg = Math.max(2, X(vv)-padL);
        g.appendChild(svgEl('rect', {x: padL, y: yy, width: larg, height: 14, rx: 2, fill: corDe(nm)}));
        // duas barras na mesma cor: a de baixo ganha textura, senão o duelo fica ilegível
        if (colide && j === 1)
          g.appendChild(svgEl('rect', {x: padL, y: yy, width: larg, height: 14, rx: 2, fill: `url(#${hid}-1)`}));
        const t = svgEl('text', {x: X(vv)+10, y: yy+11, class:'vallabel'});
        t.textContent = nd(vv) + '%'; g.appendChild(t);
      });
    } else {
      const bh = 14, yB = y0 + 7;
      if (d.max > d.min) g.appendChild(svgEl('line', {x1: X(d.min), x2: X(d.max), y1: yB+bh+8, y2: yB+bh+8,
        stroke: css('--axis'), 'stroke-width': 2, 'stroke-linecap':'round'}));
      const av = comAvatar ? avatarSVG(g, padL - (estreito ? 106 : 168), yB + bh/2, 11, d.nome) : null;
      const lb = svgEl('text', {x: padL - 12, y: yB + bh - 2, 'text-anchor':'end',
        class: 'catlabel' + (SITUACAO[d.nome] ? ' alerta' : '')});
      lb.textContent = (SITUACAO[d.nome] ? '⚠ ' : '') + nx(d.nome);
      g.appendChild(lb);
      ajustes.push({lb, av, cy: yB + bh/2});
      const largS = Math.max(2, X(d.media)-padL);
      g.appendChild(svgEl('rect', {x: padL, y: yB, width: largS, height: bh, rx: 2, fill: corDe(d.nome)}));
      const hxS = hachuraDe(hid, d.nome);
      if (hxS) g.appendChild(svgEl('rect', {x: padL, y: yB, width: largS, height: bh, rx: 2, fill: hxS}));
      const t = svgEl('text', {x: X(d.media)+10, y: yB+bh-2, class:'vallabel'});
      t.textContent = nd(d.media) + '%'; g.appendChild(t);
    }

    const hit = svgEl('rect', {x: 0, y: y0, width: W, height: alt, fill: 'transparent'});
    hit.addEventListener('pointerenter', () => {
      if (opts.par) {
        // título na mesma ordem do rótulo da linha: quem está na frente primeiro
        const tit = n => foraDaUrna(n) ? `<span class="fora">⚠ ${nx(n)}</span>` : nx(n);
        const ordem = d.va >= d.vb ? [d.a, d.b] : [d.b, d.a];
        const adendo = ordem.filter(foraDaUrna).map(n =>
          `<div class="fora-nota"><span>⚠</span><span><b>${nx(n)}</b>: ${motivoFora(n)}.</span></div>`).join('');
        dica(tip, host, W/2, y0 + alt/2, `<b>${tit(ordem[0])} × ${tit(ordem[1])}</b>` +
          linhasDica([{nome:d.a, v:d.va, cor:corDe(d.a)}, {nome:d.b, v:d.vb, cor:corDe(d.b)}]) +
          (() => {
            // diferença em pontos percentuais (subtração) e em percentual (quanto o
            // primeiro tem a mais que o segundo, relativo ao valor do segundo)
            const [hi, lo] = d.va >= d.vb ? [[d.a, d.va], [d.b, d.vb]] : [[d.b, d.vb], [d.a, d.va]];
            const pp = hi[1] - lo[1];
            const rel = lo[1] > 0 ? pp / lo[1] * 100 : null;
            const lin = (r, v) => `<div class="dif-l"><span>${r}</span><span class="v">${v}</span></div>`;
            const dif = '<div class="dif">' + (pp < 0.05
              ? lin('Empate', '0,0 p.p.')
              : lin('Diferença', nd(pp) + ' p.p.') +
                (rel != null ? lin(`${nx(hi[0])} tem a mais`, nd(rel) + '%') : '')) + '</div>';
            return dif + adendo + `<div class="n">${d.n} simulaç${d.n>1?'ões':'ão'}</div>`;
          })());
      } else {
        const rel = d.margem && d.media ? (d.margem/d.media*100) : null;
        dica(tip, host, X(d.media), y0 + alt/2, `<b>${nx(d.nome)}${PARTIDO[d.nome] ? ' · '+MAI(PARTIDO[d.nome]) : ''}</b>` +
          `<div class="row"><span>Média</span><span class="num">${nd(d.media)}%</span></div>` +
          `<div class="row"><span>Faixa</span><span class="num">${nd(d.min)}–${nd(d.max)}%</span></div>` +
          (d.margem ? `<div class="row"><span>Margem</span><span class="num">±${nd(d.margem)} p.p.${rel?' · ±'+nd(rel)+'%':''}</span></div>` : '') +
          (SITUACAO[d.nome] ? `<div class="n" style="color:var(--warn)"><b>${SITUACAO[d.nome].t}</b> — candidatura indeferida pelo TSE</div>` : '') +
          `<div class="n">${d.n} pesquisa${d.n>1?'s':''} no período</div>`);
      }
    });
    hit.addEventListener('pointerleave', () => semDica(tip));
    g.appendChild(hit);
    svg.appendChild(g);
  });
  host.appendChild(svg);
  encaixaRotulos(ajustes, padL);
}

// ---------------------------------------------------------------- viés de casa (insight)
function viesDeCasa(rows) {
  const porDiaCand = new Map();
  rows.forEach(r => { const k = r.ds + '|' + r.nome; const a = porDiaCand.get(k) || {s:0,n:0};
    a.s += r.v; a.n++; porDiaCand.set(k, a); });
  const foco = resumo1(rows).slice(0, 2).map(r => r.nome);
  const m = new Map();
  rows.forEach(r => { if (!foco.includes(r.nome)) return;
    const base = porDiaCand.get(r.ds + '|' + r.nome); if (!base || base.n < 2) return;
    const media = base.s / base.n;
    const a = m.get(r.i) || {inst: r.i, por: {}, n: 0};
    a.por[r.nome] = a.por[r.nome] || {s:0, n:0};
    a.por[r.nome].s += r.v - media; a.por[r.nome].n++; a.n++; m.set(r.i, a);
  });
  const out = [...m.values()].map(a => ({inst: a.inst, n: a.n,
    vals: foco.map(f => a.por[f] && a.por[f].n ? a.por[f].s/a.por[f].n : null)}))
    .filter(a => a.vals.some(v => v != null));
  out.sort((x,y) => (y.vals[0] ?? 0) - (x.vals[0] ?? 0));
  return {foco, linhas: out};
}
function desenhaVies(host, tip, dados, anima) {
  [...host.children].forEach(c => { if (c !== tip) c.remove(); });
  const {foco, linhas} = dados;
  if (!linhas.length || foco.length < 2) {
    host.insertAdjacentHTML('beforeend', '<p class="nota">Precisa de pelo menos dois institutos medindo no mesmo dia.</p>'); return; }
  const W = Math.max(280, host.clientWidth - 16);
  const estreito = W < 520;
  const maiorNome = Math.max(0, ...linhas.map(l => larguraTexto(MAI(l.inst), '400', 13, css('--texto'))));
  // nomes alinhados à esquerda, com respiro da borda (ML) e do eixo (GAP)
  // no celular o gutter cresce um pouco: é melhor encurtar a barra que cortar o nome
  const ML = 14, GAP = estreito ? 20 : 28;
  const padL = Math.min(W * (estreito ? 0.54 : 0.46), Math.ceil(maiorNome) + ML + GAP), padR = 44, padT = 10, padB = 34, alt = 26;
  const H = padT + linhas.length*alt + padB;
  const lim = Math.max(1.5, ...linhas.flatMap(l => l.vals.filter(v => v != null).map(Math.abs)));
  const esc = Math.ceil(lim*2)/2;
  const X = v => padL + ((v + esc)/(2*esc))*(W - padL - padR);

  const svg = svgEl('svg', {viewBox: `0 0 ${W} ${H}`, role: 'img'});
  const ajustesV = [];
  // no celular, 5 marcas no eixo viram uma tarja ilegível: ficam 3
  const passoV = estreito ? esc : esc/2;
  for (let v = -esc; v <= esc + 1e-9; v += passoV) {
    const zero = Math.abs(v) < 1e-9;
    svg.appendChild(svgEl('line', {x1: X(v), x2: X(v), y1: padT, y2: H-padB,
      stroke: zero ? css('--axis') : css('--grid'), 'stroke-width': 1}));
    const l = svgEl('text', {x: X(v), y: H-padB+19, 'text-anchor':'middle', class:'tick'});
    l.textContent = (v > 0 ? '+' : '') + nd(v); svg.appendChild(l);
  }
  linhas.forEach((ln, i) => {
    const y = padT + i*alt + alt/2;
    const g = svgEl('g', {});
    if (anima) { g.classList.add('surge'); g.style.animationDelay = (i*24) + 'ms'; }
    const lb = svgEl('text', {x: ML, y: y+4, 'text-anchor':'start', class:'catlabel'});
    lb.textContent = MAI(ln.inst);
    ajustesV.push({lb});
    g.appendChild(lb);
    const vv = ln.vals.filter(v => v != null);
    if (vv.length === 2) g.appendChild(svgEl('line', {x1: X(vv[0]), x2: X(vv[1]), y1: y, y2: y,
      stroke: css('--axis'), 'stroke-width': 1.5, 'stroke-linecap':'round'}));
    ln.vals.forEach((v, j) => { if (v == null) return;
      g.appendChild(svgEl('circle', {cx: X(v), cy: y, r: 5, fill: corDe(foco[j]),
        stroke: css('--sunken'), 'stroke-width': 2})); });
    const hit = svgEl('rect', {x:0, y: padT+i*alt, width: W, height: alt, fill:'transparent'});
    hit.addEventListener('pointerenter', () => dica(tip, host, W/2, y,
      `<b>${MAI(ln.inst)}</b>` + linhasDica(foco.map((f,j) => ({nome: f, v: ln.vals[j] ?? 0, cor: corDe(f)})))
        .replace(/(\d)%/g, '$1 p.p.') + `<div class="n">desvio médio em relação às outras pesquisas do mesmo dia</div>`));
    hit.addEventListener('pointerleave', () => semDica(tip));
    g.appendChild(hit);
    svg.appendChild(g);
  });
  host.appendChild(svg);
  // encurta só o que não cabe entre a margem e o eixo
  const espacoV = padL - ML - GAP;
  ajustesV.forEach(({lb}) => {
    const cheio = lb.textContent; let txt = cheio;
    while (txt.length > 6 && lb.getComputedTextLength() > espacoV) {
      txt = txt.slice(0, -2); lb.textContent = txt + '…';
    }
    if (txt !== cheio) {                       // nome encurtado: o inteiro fica no toque/hover
      const t = svgEl('title', {}); t.textContent = cheio; lb.appendChild(t);
    }
  });
}

// ---------------------------------------------------------------- tabela ordenável
// cols[i].ini = direção da ordenação inicial (-1 decrescente); sem nenhum ini, abre pela
// coluna "pad". cols[i].oculta = coluna só de apoio (ordenação/rótulo), não é desenhada.
function tabela(el, cols, linhas, chave) {
  el.classList.add('tabwrap');
  const iIni = cols.findIndex(c => c.ini);
  const ord = st.ord[chave] || (iIni >= 0 ? {col: iIni, dir: cols[iIni].ini}
                                          : {col: cols.findIndex(c => c.pad), dir: -1});
  st.ord[chave] = ord;
  const dados = linhas.slice().sort((a, b) => {
    const x = a[ord.col], y = b[ord.col];
    const nx = typeof x === 'number', ny = typeof y === 'number';
    if (nx && ny) return (x - y) * ord.dir;
    return String(x).localeCompare(String(y), 'pt-BR') * ord.dir;
  });
  el.innerHTML = '<table><thead><tr>' + cols.map((c, i) => c.oculta ? '' :
      `<th class="${i === ord.col ? 'ord' + (ord.dir === 1 ? ' asc' : '') : ''}" data-c="${i}" title="Ordenar por ${c.t}">${c.t}</th>`).join('') +
    '</tr></thead><tbody>' + dados.map((r, ri) =>
      `<tr style="animation-delay:${Math.min(ri, 14)*18}ms" class="surge">` + r.map((v, i) => cols[i].oculta ? '' :
        `<td class="${i === ord.col ? 'ord' : ''}">${cols[i].f ? cols[i].f(v, r) : (typeof v === 'number' ? nd(v) : v)}</td>`).join('') + '</tr>').join('') +
    '</tbody></table>';
  el.querySelectorAll('th').forEach(th => th.onclick = () => {
    const c = +th.dataset.c;
    st.ord[chave] = {col: c, dir: ord.col === c ? -ord.dir : -1};
    tabela(el, cols, linhas, chave);
  });
}
const celCand = nome => `<span class="celcand">` + (FOTO[nome]
  ? `<img class="cand-av" src="${FOTO[nome]}" alt="" style="--anel:${corDe(nome)}">`
  : `<span class="cand-av" style="background:${corDe(nome)}"></span>`) + `${nx(nome)}</span>`;

// ---------------------------------------------------------------- painéis
function painelT1(anima) {
  const rows = fat1(), res = resumo1(rows);
  const nPesq = new Set(rows.map(r => r.ds + '|' + r.i)).size;
  const nInst = new Set(rows.map(r => r.i)).size;
  const lider = res[0], vice = res[1];
  const mgMedia = res.length ? res.reduce((a,r) => a + (r.margem||0), 0) / res.filter(r => r.margem).length : null;

  $('painel').innerHTML = `
    <div class="tiles anim-sobe">
      <div class="tile"><div class="k">Pesquisas</div><div class="v" data-num="${nPesq}">0</div><div class="s">${nInst} institutos</div></div>
      <div class="tile"><div class="k">Líder</div><div class="v" data-num="${lider?lider.media:0}" data-suf="%">0</div><div class="s">${lider?nx(lider.nome):'–'}</div></div>
      <div class="tile"><div class="k">Vantagem</div><div class="v" data-num="${lider&&vice?lider.media-vice.media:0}" data-suf=" p.p.">0</div><div class="s">sobre ${vice?nx(vice.nome):'–'}</div></div>
      <div class="tile"><div class="k">Margem de erro</div><div class="v" data-num="${mgMedia||0}" data-pre="±" data-suf=" p.p.">0</div><div class="s">${lider&&mgMedia?'±'+nd(mgMedia/lider.media*100)+'% do valor do líder':'média das pesquisas'}</div></div>
    </div>

    <section class="card">
      <div class="card-topo"><div><h2>Evolutivo do 1º turno</h2>
        <p class="sub">Média das pesquisas de cada dia. Linha cheia suaviza 5 dias quando há série longa; a clara é o dia cru. Clique na legenda para isolar.</p></div></div>
      <div class="plot" id="p-linha"><div class="tip" id="tip-linha"></div></div>
      <div class="legenda" id="leg-linha"></div>
      <div id="tab-linha" hidden></div>
      <p class="nota">Só cenários em que todos os nomes testados têm candidatura registrada no TSE. Listas hipotéticas de antes do prazo de registro (15/08), com nomes como Jair Bolsonaro, Michelle Bolsonaro e Fernando Haddad, ficam de fora: o percentual medido contra outra lista não é comparável.</p>
    </section>

    <section class="card">
      <div class="card-topo"><div><h2>Comparação entre candidatos</h2>
        <p class="sub">Média no período, com a faixa entre o menor e o maior resultado dos institutos.</p></div></div>
      ${Object.keys(SITUACAO).filter(n => res.some(r => r.nome === n)).map(n =>
        `<div class="aviso alerta"><span><b>${nx(n)}</b> aparece nas pesquisas, mas não está na urna.</span> ${SITUACAO[n].d}</div>`).join('')}
      <div class="plot" id="p-barra"><div class="tip" id="tip-barra"></div></div>
      <div id="tab-barra" hidden></div>
    </section>

    <section class="card">
      <div class="card-topo"><div><h2>Viés de casa</h2>
        <p class="sub">Quanto cada instituto mede acima ou abaixo das outras pesquisas do mesmo dia, em pontos percentuais. Zero é o consenso do dia.</p></div></div>
      <div class="plot" id="p-vies"><div class="tip" id="tip-vies"></div></div>
      <div class="legenda" id="leg-vies"></div>
      <p class="nota">Só entram dias com duas ou mais pesquisas — sem comparação no mesmo dia não há desvio a medir.</p>
    </section>`;

  const topN = res.slice(0, N_LINHAS()).map(r => r.nome);
  const s = serieDiaria(rows, topN);
  const series = topN.map(n => ({nome: n, cor: corDe(n), traco: tracoDe(n), pts: s[n], on: !st.off.has(n)}));

  if (st.tabela) {
    $('p-linha').hidden = true; $('leg-linha').hidden = true; $('tab-linha').hidden = false;
    $('p-barra').hidden = true; $('tab-barra').hidden = false;
    const dias = [...new Set(Object.values(s).flat().map(p => +p.d))].sort();
    // Dia guarda o carimbo numérico (ordena pela data de verdade) e só formata na tela;
    // abre do dia mais recente para o mais antigo
    tabela($('tab-linha'), [{t:'Dia', ini: -1, f: v => dBR(new Date(v))}, ...topN.map(n => ({t:nx(n)}))],
      dias.map(t => [t, ...topN.map(n => { const p = s[n].find(q => +q.d === t); return p ? p.v : null; })]), 'linha');
    tabela($('tab-barra'), [
      {t:'Candidato', f: v => celCand(v)}, {t:'Partido', f: v => MAI(v)}, {t:'Média %'}, {t:'Mín %'}, {t:'Máx %'},
      {t:'Margem p.p.'}, {t:'Pesquisas', pad:true, f: v => ni(v)}],
      res.map(r => [r.nome, PARTIDO[r.nome]||'', r.media, r.min, r.max, r.margem, r.n]), 'barra');
  } else {
    // 1º turno: eixo de 25 em 25 a partir do zero, até o primeiro múltiplo acima do maior valor
    desenhaLinhas($('p-linha'), $('tip-linha'), series, {anima, passoY: 25, minY: 0});
    legenda($('leg-linha'), series, true);
    desenhaBarras($('p-barra'), $('tip-barra'), res, {anima});
  }
  const vies = viesDeCasa(rows);
  desenhaVies($('p-vies'), $('tip-vies'), vies, anima);
  legenda($('leg-vies'), vies.foco.map(f => ({nome: f, cor: corDe(f), on: true})), false);
  contaNumeros();
}

function painelT2(anima) {
  const rows = fat2();
  const par = [st.a, st.b].sort();
  const doDuelo = rows.filter(r => [r.a, r.b].sort().join('||') === par.join('||'));
  const agrup = new Map();
  rows.forEach(r => { const k = [r.a, r.b].sort().join('||');
    const a = agrup.get(k) || {a: r.a, b: r.b, sa:0, sb:0, n:0};
    if (a.a === r.a) { a.sa += r.va; a.sb += r.vb; } else { a.sa += r.vb; a.sb += r.va; }
    a.n++; agrup.set(k, a); });
  const comp = [...agrup.values()].map(x => ({a:x.a, b:x.b, va:x.sa/x.n, vb:x.sb/x.n, n:x.n}))
    // mais acirrado primeiro: menor diferença entre os dois; empate desfeito por mais simulações
    .sort((x,y) => Math.abs(x.va - x.vb) - Math.abs(y.va - y.vb) || y.n - x.n);
  // por padrão só confrontos entre candidatos na urna; o resto é cenário hipotético e
  // fica atrás do botão (ainda marcado com ⚠ quando aparece)
  const reais = comp.filter(c => !foraDaUrna(c.a) && !foraDaUrna(c.b));
  const lista = st.hipot ? comp : reais;
  const nHip = comp.length - reais.length;
  const nSim = rows.length;
  const atual = comp.find(c => [c.a,c.b].sort().join('||') === par.join('||'));
  // os tiles e o título seguem quem está à frente, não a ordem dos seletores
  const vDe = nome => !atual ? 0 : (atual.a === nome ? atual.va : atual.vb);
  const dupla = [st.a, st.b].sort((x, y) => vDe(y) - vDe(x));

  $('painel').innerHTML = `
    <div class="tiles anim-sobe">
      <div class="tile"><div class="k">Simulações</div><div class="v" data-num="${nSim}">0</div><div class="s">${comp.length} duelos distintos</div></div>
      <div class="tile"><div class="k">${nx(dupla[0])||'–'}</div><div class="v" data-num="${vDe(dupla[0])}" data-suf="%">0</div><div class="s">no duelo selecionado</div></div>
      <div class="tile"><div class="k">${nx(dupla[1])||'–'}</div><div class="v" data-num="${vDe(dupla[1])}" data-suf="%">0</div><div class="s">no duelo selecionado</div></div>
      <div class="tile"><div class="k">Diferença</div><div class="v" data-num="${atual?Math.abs(atual.va-atual.vb):0}" data-suf=" p.p.">0</div><div class="s">${atual? nx(dupla[0])+' à frente' : '–'}</div></div>
    </div>

    <section class="card">
      <div class="card-topo"><div><h2>Evolutivo do duelo</h2>
        <p class="sub">${nx(dupla[0])} × ${nx(dupla[1])}, média das pesquisas de cada dia. A área sombreada é a diferença entre os dois.</p></div></div>
      <div class="plot" id="p-linha"><div class="tip" id="tip-linha"></div></div>
      <div class="legenda" id="leg-linha"></div>
      <div id="tab-linha" hidden></div>
      <p class="nota">${doDuelo.length} simulações deste duelo no período. Troque os nomes no filtro acima.</p>
    </section>

    <section class="card">
      <div class="card-topo"><div><h2>Todos os duelos</h2>
        <p class="sub">Média de cada confronto no período, do mais acirrado ao menos acirrado. ${st.hipot
          ? `Inclui ${nHip} cenários hipotéticos, marcados com ⚠.`
          : `Só confrontos entre candidatos com candidatura registrada no TSE (${reais.length} de ${comp.length}).`}</p></div>
        ${nHip ? `<div class="seg" role="group" aria-label="Confrontos exibidos">
          <button type="button" data-hipot="0" aria-pressed="${!st.hipot}">Só candidatos</button>
          <button type="button" data-hipot="1" aria-pressed="${st.hipot}">Incluir hipotéticos</button></div>` : ''}</div>
      <div class="plot" id="p-barra"><div class="tip" id="tip-barra"></div></div>
      <div id="tab-barra" hidden></div>
    </section>`;

  const porDia = new Map();
  doDuelo.forEach(r => { const A = r.a === par[0] ? r.va : r.vb, B = r.a === par[0] ? r.vb : r.va;
    const a = porDia.get(r.ds) || {d: r.d, sa:0, sb:0, n:0}; a.sa += A; a.sb += B; a.n++; porDia.set(r.ds, a); });
  const dias = [...porDia.values()].sort((x,y) => x.d - y.d);
  const series = [
    {nome: par[0], cor: corDe(par[0]), traco: tracoDe(par[0]), on: true, pts: dias.map(x => ({d:x.d, v:x.sa/x.n, n:x.n}))},
    {nome: par[1], cor: corDe(par[1]), traco: tracoDe(par[1]), on: true, pts: dias.map(x => ({d:x.d, v:x.sb/x.n, n:x.n}))}
  ].sort((x,y) => (y.pts.length?y.pts[y.pts.length-1].v:0) - (x.pts.length?x.pts[x.pts.length-1].v:0));

  if (st.tabela) {
    $('p-linha').hidden = true; $('leg-linha').hidden = true; $('tab-linha').hidden = false;
    $('p-barra').hidden = true; $('tab-barra').hidden = false;
    tabela($('tab-linha'), [{t:'Dia', ini: -1, f: v => dBR(new Date(v))}, {t:nx(series[0].nome)+' %'}, {t:nx(series[1].nome)+' %'}, {t:'Pesquisas', pad:true, f: v=>ni(v)}],
      dias.map(x => [+x.d, (x.sa/x.n), (x.sb/x.n), x.n].map((v,i) => i===1||i===2 ? (series[0].nome===par[0] ? v : v) : v)), 'linha2');
    // o duelo inteiro num bloco só (foto, nomes e ×) para alinhar pela mesma linha de base;
    // quem está fora da urna ganha ⚠ e sublinhado, como no gráfico
    const nomeDuelo = n => foraDaUrna(n) ? `<span class="fora">⚠ ${nx(n)}</span>` : nx(n);
    tabela($('tab-barra'), [{t:'Duelo', f: (v,r) => `<span class="celduelo">${
        celCand(r[6]).replace(`>${nx(r[6])}</span>`, `>${nomeDuelo(r[6])}</span>`)}<span class="x">×</span>${nomeDuelo(r[7])}</span>`},
      {t:'Maior %'}, {t:'Menor %'}, {t:'Diferença p.p.'}, {t:'Simulações', pad:true, f: v=>ni(v)},
      {t:'', oculta:true}, {t:'', oculta:true}, {t:'', oculta:true}],
      lista.map(c => { const hi = c.va >= c.vb ? c.a : c.b, lo = c.va >= c.vb ? c.b : c.a;
        const vh = Math.max(c.va, c.vb), vl = Math.min(c.va, c.vb);
        return [hi+' × '+lo, vh, vl, vh-vl, c.n, '', hi, lo]; }), 'barra2');
  } else {
    desenhaLinhas($('p-linha'), $('tip-linha'), series, {anima, faixa: true});
    legenda($('leg-linha'), series, false);
    desenhaBarras($('p-barra'), $('tip-barra'), lista, {anima, par: true});
  }
  contaNumeros();
  document.querySelectorAll('[data-hipot]').forEach(bt => bt.onclick = () => {
    st.hipot = bt.dataset.hipot === '1'; desenha(true);
  });
}

function painelInst(anima) {
  const [ini, fim] = [st.ini, st.fim];
  const lista = INST.filter(x => !st.inst || x.nm === st.inst);
  const totQt = lista.reduce((a,x) => a + x.qt, 0);
  const totVr = lista.reduce((a,x) => a + x.vr, 0);
  const totEnt = lista.reduce((a,x) => a + x.ent, 0);
  const custo = totEnt ? totVr/totEnt : null;

  $('painel').innerHTML = `
    <div class="tiles anim-sobe">
      <div class="tile"><div class="k">Pesquisas registradas</div><div class="v" data-num="${totQt}">0</div><div class="s">${lista.length} institutos</div></div>
      <div class="tile"><div class="k">Investimento declarado</div><div class="v" data-num="${totVr}" data-moeda="1" data-compacto="1">0</div><div class="s">${moeda(totVr)} declarados ao TSE</div></div>

      <div class="tile"><div class="k">Custo por entrevista</div><div class="v" data-num="${custo||0}" data-moeda="1" data-dec="2">0</div><div class="s">total investido ÷ entrevistas</div></div>
    </div>

    <section class="card">
      <div class="card-topo"><div><h2>Evolutivo do mercado de pesquisas</h2>
        <p class="sub">Registros no TSE por mês. Cada linha está na própria escala: 100% é o mês de pico dela. Passe o mouse para ver os números absolutos.</p></div></div>
      <div class="plot" id="p-mes"><div class="tip" id="tip-mes"></div></div>
      <div class="legenda" id="leg-mes"></div>

    <section class="card">
      <div class="card-topo"><div><h2>Institutos</h2>

      <div id="tab-inst"></div>
    </section>

    <section class="card">
      <div class="card-topo"><div><h2>Quem são</h2>
        <p class="sub">Quem faz as pesquisas que aparecem nas abas de 1º e 2º turno: quando a empresa surgiu, quem dirige e como ela coleta as respostas.</p></div></div>
      <div class="fichas" id="fichas"></div>
      <p class="nota">Método de coleta muda resultado: entrevista na rua, ligação, URA e painel online alcançam gente diferente. Por isso dois institutos podem medir o mesmo dia e chegar a números distintos — é o que o gráfico de viés de casa mostra na aba de 1º turno.</p>
    </section>`;

  const porMes = new Map();
  IMES.filter(x => !st.inst || x.nm === st.inst).forEach(x => {

  const meses = [...porMes.values()].sort((a,b) => a.m.localeCompare(b.m));
  const maxQt = Math.max(1, ...meses.map(x => x.qt)), maxVr = Math.max(1, ...meses.map(x => x.vr));
  const series = [
    {nome: 'Pesquisas', cor: css('--c1'), traco: '', on: true,
     pts: meses.map(x => ({d: pd(x.m + '-01'), v: x.qt/maxQt*100, n: x.qt, bruto: x.qt}))},
    {nome: 'Valor declarado', cor: css('--c2'), traco: '4 3', on: true,
     pts: meses.map(x => ({d: pd(x.m + '-01'), v: x.vr/maxVr*100, n: x.qt, bruto: x.vr}))}
  ];
  desenhaLinhas($('p-mes'), $('tip-mes'), series, {anima, passoY: 25, maxY: 100});
  legenda($('leg-mes'), series, false);
  $('leg-mes').insertAdjacentHTML('beforeend',
    `<span class="nota" style="margin:0; flex-basis:100%; text-align:center">pico: ${ni(maxQt)} pesquisas · ${moeda(maxVr)}</span>`);

  // fichas: só institutos com perfil pesquisado, ordenados pelo que registraram
  const comInfo = [];
  const vistos = new Set();
  lista.slice().sort((a,b) => b.qt - a.qt).forEach(x => {
    const inf = infoDe(x.nm);
    if (inf && !vistos.has(inf.n)) { vistos.add(inf.n); comInfo.push({inf, d: x}); }
  });
  $('fichas').innerHTML = comInfo.map(({inf, d}, i) => `
    <div class="ficha surge" style="animation-delay:${Math.min(i,12)*30}ms">
      <h3>${MAI(inf.n)}</h3>
      <p>${inf.d}</p>
      <div class="num"><span><b>${ni(d.qt)}</b> pesquisas</span><span><b>${ni(d.pres)}</b> presidenciais</span>
        <span><b>${ni(d.ent)}</b> entrevistas</span><span>fonte: ${inf.f}</span></div>
    </div>`).join('')
    || '<p class="nota">Nenhum instituto com perfil pesquisado no recorte atual.</p>';

  tabela($('tab-inst'), [
    {t:'Instituto', f: v => `<span class="qinst${infoDe(v) ? '' : ' sem'}" data-i="${v.replace(/"/g,'&quot;')}">${MAI(v)}</span>`},
    {t:'Pesquisas', pad:true, f: v => ni(v)},
    {t:'Presidência', f: v => ni(v)},
    {t:'Próprias', f: v => nd(v) + '%'},
    {t:'Investimento', f: v => moeda(v)},
    {t:'Entrevistas', f: v => ni(v)},
    {t:'Custo/entrev.', f: v => v ? moeda(v) : '–'},
    {t:'Com alerta', f: v => ni(v)}],
    lista.map(x => [x.nm, x.qt, x.pres, x.qt ? x.prop/x.qt*100 : 0, x.vr, x.ent,
                    x.ent ? x.vr/x.ent : 0, x.al]), 'inst');
  contaNumeros();
}

function painelProp() {

    ['2026-08-15', 'Prazo final de registro de candidatura', 'O plano de governo é entregue junto com o pedido de registro. É daqui que saem os PDFs abaixo.'],
    ['2026-09-27', 'Debate Record + Estadão', 'Confirmado.'],

    </div>

    <section class="card">
      <div class="card-topo">
        <div><h2>O que cada candidatura propõe</h2>
          <p class="sub">Trechos do plano de governo que cada candidatura protocolou no TSE até 15/08/2026. Clique em qualquer candidato (↗) para abrir o plano de governo completo dele, com todas as propostas, no site do TSE.</p></div>
        <div class="card-acoes"><div class="seg" role="group" aria-label="Organizar por">
          <button type="button" id="pv-tema" aria-pressed="true">Por tema</button>
          <button type="button" id="pv-cand" aria-pressed="false">Por candidato</button>
        </div></div>
      </div>
      <div id="prop-corpo"></div>
      <p class="nota">Texto descritivo do que o documento propõe, sem juízo de valor e sem avaliação de viabilidade. Um plano pode ser substituído durante a campanha; quando há mais de uma versão protocolada, vale a mais recente.</p>
    </section>

    <section class="card">
      <div class="card-topo"><div><h2>Calendário</h2>
        <p class="sub">Onde as propostas são defendidas em público até a votação.</p></div></div>
      <div class="linhatempo">
        ${AGENDA.map(a => {
          const passou = a.d < hoje, dias = Math.round((a.d - hoje)/864e5);
          return `<div class="etapa${passou ? ' passou' : ''}">
            <div class="quando"><b>${dBR(a.d)}</b><span>${passou ? 'já ocorreu' : dias === 0 ? 'hoje' : 'em ' + dias + ' dia' + (dias > 1 ? 's' : '')}</span></div>

        }).join('')}
      </div>
    </section>`;

                  : `<span class="cand-av" style="background:${corDe(c.n)}"></span>`}

  function porTema() {
    $('prop-corpo').innerHTML = PROP.temas.map((t, k) => {

      return `<section class="tema surge" style="animation-delay:${Math.min(k,8)*30}ms">
