name: Carga eleicoes2026 (TSE + Wikipedia -> Databricks -> dbt)

on:
  schedule:
    # 09:00 UTC = 06:00 em Brasília, todos os dias
    - cron: "0 9 * * *"
  workflow_dispatch:
    inputs:
      rodar_tse:
        description: "Carregar fontes do TSE (runner no computador local)"
        type: boolean
        default: true
      rodar_wikipedia:
        description: "Carregar Wikipedia (runner do GitHub)"
        type: boolean
        default: true
      rodar_dbt:
        description: "Disparar o job do dbt após a carga"
        type: boolean
        default: true

concurrency:
  group: carga-eleicoes2026
  cancel-in-progress: false

permissions:
  contents: read

jobs:
  # O CDN do TSE (cdn.tse.jus.br) responde 403 para IPs de datacenter do GitHub.
  # Por isso esta carga roda no runner self-hosted (computador com IP no Brasil).
  carga_tse:
    name: Carga TSE (runner local)
    if: ${{ github.event_name == 'schedule' || github.event.inputs.rodar_tse == 'true' }}
    environment: producao
    runs-on: [self-hosted, Windows]
    timeout-minutes: 45
    defaults:
      run:
        shell: powershell
    steps:
      - uses: actions/checkout@v4

      - name: Preparar Python (venv)
        run: |
          $ErrorActionPreference = "Stop"
          $candidatos = @(
            (Get-Command py -ErrorAction SilentlyContinue).Source,
            (Get-Command python -ErrorAction SilentlyContinue).Source,
            "$env:USERPROFILE\anaconda3\python.exe",
            "$env:USERPROFILE\miniconda3\python.exe",
            "$env:ProgramData\anaconda3\python.exe"
          ) | Where-Object { $_ -and (Test-Path $_) -and ($_ -notlike "*WindowsApps*") }
          if (-not $candidatos) { throw "Python não encontrado no computador do runner" }
          $py = $candidatos[0]
          Write-Host "Python base: $py"
          & $py -m venv .venv
          if ($LASTEXITCODE -ne 0) { throw "falha ao criar venv" }
          & .\.venv\Scripts\python.exe -m pip install --upgrade pip --quiet
          & .\.venv\Scripts\python.exe -m pip install -r ingestion\requirements.txt --quiet
          if ($LASTEXITCODE -ne 0) { throw "falha ao instalar dependências" }

      - name: Carregar TSE
        env:
          DATABRICKS_HOST: ${{ vars.DATABRICKS_HOST }}
          DATABRICKS_WAREHOUSE_ID: ${{ vars.DATABRICKS_WAREHOUSE_ID }}
          DATABRICKS_CATALOG: ${{ vars.DATABRICKS_CATALOG || 'workspace' }}
          DATABRICKS_SCHEMA: ${{ vars.DATABRICKS_SCHEMA || 'raw_eleicoes' }}
          DATABRICKS_TOKEN: ${{ secrets.DATABRICKS_TOKEN }}
          FONTES: pesquisa_eleitoral_2026,totalizacao_presidente_2022
          PYTHONIOENCODING: utf-8
          PYTHONUTF8: "1"
        run: |
          & .\.venv\Scripts\python.exe ingestion\carga_raw.py
          exit $LASTEXITCODE

  carga_wikipedia:
    name: Carga Wikipedia (runner GitHub)
    if: ${{ github.event_name == 'schedule' || github.event.inputs.rodar_wikipedia == 'true' }}
    environment: producao
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: ingestion/requirements.txt

      - name: Instalar dependências
        run: pip install -r ingestion/requirements.txt

      - name: Carregar Wikipedia
        env:
          DATABRICKS_HOST: ${{ vars.DATABRICKS_HOST }}
          DATABRICKS_WAREHOUSE_ID: ${{ vars.DATABRICKS_WAREHOUSE_ID }}
          DATABRICKS_CATALOG: ${{ vars.DATABRICKS_CATALOG || 'workspace' }}
          DATABRICKS_SCHEMA: ${{ vars.DATABRICKS_SCHEMA || 'raw_eleicoes' }}
          DATABRICKS_TOKEN: ${{ secrets.DATABRICKS_TOKEN }}
          FONTES: intencao_voto_2026
        run: python ingestion/carga_raw.py

  dbt:
    name: Disparar job do dbt
    needs: [carga_tse, carga_wikipedia]
    # roda se nenhuma carga falhou (cargas desmarcadas contam como "skipped")
    if: ${{ !cancelled() && !contains(needs.*.result, 'failure') && (github.event_name == 'schedule' || github.event.inputs.rodar_dbt == 'true') }}
    environment: producao
    runs-on: ubuntu-latest
    timeout-minutes: 60
    env:
      DBT_CLOUD_HOST: ${{ vars.DBT_CLOUD_HOST }}
      DBT_CLOUD_ACCOUNT_ID: ${{ vars.DBT_CLOUD_ACCOUNT_ID }}
      DBT_CLOUD_JOB_ID: ${{ vars.DBT_CLOUD_JOB_ID }}
      DBT_CLOUD_API_TOKEN: ${{ secrets.DBT_CLOUD_API_TOKEN }}
    steps:
      - name: Disparar e acompanhar o job
        run: |
          if [ -z "$DBT_CLOUD_JOB_ID" ] || [ -z "$DBT_CLOUD_API_TOKEN" ]; then
            echo "::notice::Job do dbt não configurado (DBT_CLOUD_JOB_ID / DBT_CLOUD_API_TOKEN). Etapa ignorada."
            exit 0
          fi
          base="https://${DBT_CLOUD_HOST}/api/v2/accounts/${DBT_CLOUD_ACCOUNT_ID}"
          auth="Authorization: Token ${DBT_CLOUD_API_TOKEN}"
          run_id=$(curl -sfS -X POST "$base/jobs/${DBT_CLOUD_JOB_ID}/run/" -H "$auth" \
            -H "Content-Type: application/json" \
            -d "{\"cause\": \"GitHub Actions ${GITHUB_RUN_ID} (carga TSE/Wikipedia)\"}" | jq -r '.data.id')
          echo "run dbt: $run_id"
          # status: 1 queued, 2 starting, 3 running, 10 success, 20 error, 30 cancelled
          for i in $(seq 1 110); do
            status=$(curl -sfS "$base/runs/${run_id}/" -H "$auth" | jq -r '.data.status')
            case "$status" in
              10) echo "dbt concluído com sucesso"; exit 0 ;;
              20|30) echo "::error::job do dbt terminou com status $status (run $run_id)"; exit 1 ;;
            esac
            sleep 30
          done
          echo "::error::tempo esgotado aguardando o dbt (run $run_id)"; exit 1
