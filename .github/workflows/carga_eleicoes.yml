name: Carga eleicoes2026 (TSE + Wikipedia -> Databricks -> dbt)

on:
  # Dois agendamentos (UTC; Brasilia = UTC-3). Minutos quebrados de proposito: o GitHub atrasa
  # muito o que esta marcado na hora cheia (o antigo "0 9" chegava a rodar 4h depois).
  schedule:
    # CARGA COMPLETA, 1x por dia, 05:17 em Brasilia: TSE + Wikipedia + dbt + site.
    - cron: "17 8 * * *"
    # CHECAGEM, a cada 3 horas (06:07, 09:07, 12:07, 15:07 e 18:07 em Brasilia): so olha a
    # Wikipedia. Era de hora em hora, mas estourou a cota diaria da Free Edition. Se a
    # tabela de pesquisas nao mudou desde a ultima carga, para ali (nem liga o Databricks).
    # Se mudou, carrega a Wikipedia, roda o dbt e republica o site.
    - cron: "7 9-21/3 * * *"
  workflow_dispatch:
    inputs:
      rodar_tse:
        description: "Carregar fontes do TSE"
        type: boolean
        default: true
      rodar_wikipedia:
        description: "Carregar Wikipedia (runner do GitHub)"
        type: boolean
        default: true
      rodar_dbt:
        description: "Disparar o job do dbt após a carga"
        type: boolean
        default: true

concurrency:
  group: carga-eleicoes2026
  cancel-in-progress: false

permissions:
  contents: read

jobs:
  # Impressao digital da tabela da Wikipedia (sem Databricks) e comparacao com a da ultima
  # carga bem-sucedida, guardada no cache do Actions com a chave wiki-<hash>. Achou a chave =
  # nada mudou. O cache vence em 7 dias sem uso; ai a checagem seguinte so recarrega uma vez.
  verificar:
    name: Wikipedia mudou?
    if: ${{ github.event_name == 'schedule' || github.event.inputs.rodar_wikipedia == 'true' }}
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    outputs:
      hash: ${{ steps.impressao.outputs.hash }}
      mudou: ${{ steps.cache.outputs.cache-hit != 'true' }}
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-python@v7
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: ingestion/requirements.txt

      - name: Instalar dependências
        run: pip install -r ingestion/requirements.txt

      - name: Impressão digital da tabela
        id: impressao
        run: python ingestion/verificar_wikipedia.py

      - name: Já foi carregada?
        id: cache
        uses: actions/cache/restore@v6
        with:
          path: .wiki_hash
          key: wiki-${{ steps.impressao.outputs.hash }}
          lookup-only: true

      - name: Resultado
        run: |
          if [ "${{ steps.cache.outputs.cache-hit }}" = "true" ]; then
            echo "::notice title=Sem novidade::Tabela da Wikipedia igual a da ultima carga"
          else
            echo "::notice title=Novidade::Tabela da Wikipedia mudou (${{ steps.impressao.outputs.linhas }} linhas)"
          fi

  # Carga do TSE. O CDN (cdn.tse.jus.br) tem anti-bot: a carga usa curl_cffi (assinatura Chrome).
  carga_tse:
    name: Carga TSE
    # TSE so na carga completa do dia (o registro de pesquisas muda pouco ao longo do dia)
    if: ${{ github.event.schedule == '17 8 * * *' || github.event.inputs.rodar_tse == 'true' }}
    environment: producao
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-python@v7
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: ingestion/requirements.txt

      - name: Instalar dependências
        run: pip install -r ingestion/requirements.txt

      - name: Carregar TSE
        env:
          DATABRICKS_HOST: ${{ vars.DATABRICKS_HOST }}
          DATABRICKS_WAREHOUSE_ID: ${{ vars.DATABRICKS_WAREHOUSE_ID }}
          DATABRICKS_CATALOG: ${{ vars.DATABRICKS_CATALOG || 'workspace' }}
          DATABRICKS_SCHEMA: ${{ vars.DATABRICKS_SCHEMA || 'raw_eleicoes' }}
          DATABRICKS_TOKEN: ${{ secrets.DATABRICKS_TOKEN }}
          FONTES: pesquisa_eleitoral_2026,totalizacao_presidente_2022
        run: python ingestion/carga_raw.py

  carga_wikipedia:
    name: Carga Wikipedia
    needs: [verificar]
    # completa do dia e disparo manual: sempre; checagem a cada 3 horas: so se mudou
    if: ${{ !cancelled() && (github.event.schedule == '17 8 * * *' || github.event.inputs.rodar_wikipedia == 'true' || (github.event.schedule == '7 9-21/3 * * *' && needs.verificar.result == 'success' && needs.verificar.outputs.mudou == 'true')) }}
    environment: producao
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-python@v7
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: ingestion/requirements.txt

      - name: Instalar dependências
        run: pip install -r ingestion/requirements.txt

      - name: Carregar Wikipedia
        env:
          DATABRICKS_HOST: ${{ vars.DATABRICKS_HOST }}
          DATABRICKS_WAREHOUSE_ID: ${{ vars.DATABRICKS_WAREHOUSE_ID }}
          DATABRICKS_CATALOG: ${{ vars.DATABRICKS_CATALOG || 'workspace' }}
          DATABRICKS_SCHEMA: ${{ vars.DATABRICKS_SCHEMA || 'raw_eleicoes' }}
          DATABRICKS_TOKEN: ${{ secrets.DATABRICKS_TOKEN }}
          FONTES: intencao_voto_2026
        run: python ingestion/carga_raw.py

  # Transformacao. Roda dbt Core contra o mesmo warehouse da carga, com o profile em ci/profiles.yml.
  # Nao depende de job configurado no dbt Platform (a UI do dbt continua servindo para explorar/editar).
  dbt:
    name: dbt build (Databricks)
    needs: [carga_tse, carga_wikipedia]
    # roda se nenhuma carga falhou (cargas desmarcadas contam como "skipped")
    # completa do dia: sempre; checagem a cada 3 horas: so se a Wikipedia foi recarregada; manual: se pedido
    if: ${{ !cancelled() && !contains(needs.*.result, 'failure') && (github.event.schedule == '17 8 * * *' || github.event.inputs.rodar_dbt == 'true' || (github.event.schedule == '7 9-21/3 * * *' && needs.carga_wikipedia.result == 'success')) }}
    environment: producao
    runs-on: ubuntu-24.04
    timeout-minutes: 60
    env:
      DBT_PROFILES_DIR: ci
      DATABRICKS_HOST: ${{ vars.DATABRICKS_HOST }}
      DATABRICKS_HTTP_PATH: /sql/1.0/warehouses/${{ vars.DATABRICKS_WAREHOUSE_ID }}
      DATABRICKS_TOKEN: ${{ secrets.DATABRICKS_TOKEN }}
      DATABRICKS_CATALOG: ${{ vars.DATABRICKS_CATALOG || 'workspace' }}
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-python@v7
        with:
          python-version: "3.12"

      - name: Instalar dbt
        # 1.12: versao em que o projeto foi validado (sintaxe `arguments:` nos testes exige >= 1.10)
        run: pip install "dbt-core>=1.12,<1.13" "dbt-databricks>=1.12,<1.13"

      - name: dbt deps
        run: dbt deps

      - name: dbt debug
        run: dbt debug --target prod

      # build = seeds + snapshots + models + testes, na ordem do DAG
      # Na checagem, so o que depende da Wikipedia (poupa a cota diaria da Free Edition);
      # na carga completa e no disparo manual, o projeto inteiro
      - name: dbt build
        run: |
          if [ "${{ github.event.schedule }}" = "7 9-21/3 * * *" ]; then
            dbt build --target prod --select stg_wikipedia__intencao_voto_2026+
          else
            dbt build --target prod
          fi

      - name: Guardar artefatos (manifest, run_results)
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: dbt-target
          path: target/
          if-no-files-found: ignore

  # Depois do dbt, regenera o painel público (docs/index.html) e publica no GitHub Pages.
  # Roda também quando o dbt é pulado no disparo manual; não roda se algo falhou.
  publicar:
    name: Publicar painel
    needs: [dbt]
    # so quando o dbt rodou (ou no disparo manual): checagem sem novidade nao gasta warehouse
    if: ${{ !failure() && !cancelled() && (needs.dbt.result == 'success' || github.event_name == 'workflow_dispatch') }}
    permissions:
      contents: write
    uses: ./.github/workflows/publicar_site.yml
    secrets: inherit

  # Guarda a impressao digital da tabela que acabou de ir para o site: a proxima checagem que
  # achar a mesma tabela para no primeiro passo. So grava se carga, dbt e site deram certo.
  lembrar:
    name: Lembrar tabela carregada
    needs: [verificar, carga_wikipedia, dbt, publicar]
    if: ${{ !cancelled() && needs.verificar.outputs.hash != '' && needs.carga_wikipedia.result == 'success' && needs.dbt.result == 'success' && needs.publicar.result == 'success' }}
    runs-on: ubuntu-24.04
    steps:
      - run: echo "${{ needs.verificar.outputs.hash }}" > .wiki_hash
      - uses: actions/cache/save@v6
        with:
          path: .wiki_hash
          key: wiki-${{ needs.verificar.outputs.hash }}
