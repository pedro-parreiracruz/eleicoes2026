# Temporario: consultas de leitura para investigar institutos vazios no workspace novo.
# Resultado vai para o resumo da execucao (Summary). Remover depois do diagnostico.
name: Diagnostico (temporario)
on: workflow_dispatch
permissions:
  contents: read
jobs:
  diag:
    runs-on: ubuntu-latest
    environment: producao
    steps:
      - run: pip install -q databricks-sql-connector
      - env:
          DATABRICKS_HOST: ${{ vars.DATABRICKS_HOST }}
          DATABRICKS_WAREHOUSE_ID: ${{ vars.DATABRICKS_WAREHOUSE_ID }}
          DATABRICKS_TOKEN: ${{ secrets.DATABRICKS_TOKEN }}
        shell: python
        run: |
          import os
          from databricks import sql
          Q = {
            "escape": r"""select regexp_replace('Quaest[17]', '\\[[^\\]]*\\]', '') as dbl,
                                 regexp_replace('Quaest[17]', '\[[^\]]*\]', '') as sgl,
                                 length('a\tb') as len_tab, length('a\\tb') as len_dbl""",
            "conf": "set spark.sql.parser.escapedStringLiterals",
            "raw": "select instituto_texto, count(*) n from workspace.raw_eleicoes.intencao_voto_2026 group by 1 order by 2 desc limit 12",
            "stg": "select nm_instituto_origem, count(*) n from workspace.staging.stg_wikipedia__intencao_voto_2026 group by 1 order by 2 desc limit 12",
            "int": "select nm_instituto, count(*) n from workspace.intermediate.int_intencao_voto__padronizada group by 1 order by 2 desc limit 12",
            "fct": "select nm_instituto, count(*) n from workspace.marts.fct_intencao_voto group by 1 order by 2 desc limit 12",
            "seed": "select * from workspace.staging.de_para_instituto limit 5",
          }
          out = ["# Diagnostico"]
          with sql.connect(server_hostname=os.environ["DATABRICKS_HOST"],
                           http_path="/sql/1.0/warehouses/" + os.environ["DATABRICKS_WAREHOUSE_ID"],
                           access_token=os.environ["DATABRICKS_TOKEN"]) as c, c.cursor() as cur:
              for k, q in Q.items():
                  out.append(f"\n## {k}\n```")
                  try:
                      cur.execute(q)
                      for r in cur.fetchall():
                          out.append(" | ".join(repr(x)[:80] for x in r))
                  except Exception as e:
                      out.append("ERRO: " + str(e)[:300])
                  out.append("```")
          txt = "\n".join(out)
          print(txt)
          open(os.environ["GITHUB_STEP_SUMMARY"], "a").write(txt)
