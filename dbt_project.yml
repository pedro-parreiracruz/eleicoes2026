name: eleicoes2026
version: "1.0.0"
config-version: 2
profile: eleicoes2026

model-paths: ["models"]
seed-paths: ["seeds"]
test-paths: ["tests"]
macro-paths: ["macros"]
snapshot-paths: ["snapshots"]

clean-targets: ["target", "dbt_packages"]

vars:
  # Schema onde a carga bruta (ingestion/) grava as tabelas raw (catalogo = target.catalog)
  raw_schema: raw_eleicoes
  # Datas oficiais das eleicoes (usadas em dim_calendario)
  data_1t_2022: "2022-10-02"
  data_2t_2022: "2022-10-30"
  data_1t_2026: "2026-10-04"
  data_2t_2026: "2026-10-25"
  # Prazo legal minimo (dias) entre registro no PesqEle e divulgacao
  prazo_minimo_registro_dias: 5

models:
  eleicoes2026:
    +file_format: delta
    staging:
      +materialized: view
      +schema: staging
    intermediate:
      +materialized: view
      +schema: intermediate
    marts:
      +materialized: table
      +schema: marts

seeds:
  eleicoes2026:
    +schema: seeds

snapshots:
  eleicoes2026:
    +schema: snapshots

data_tests:
  eleicoes2026:
    +store_failures: true
    +schema: dq_falhas
