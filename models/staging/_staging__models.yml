version: 2

models:
  - name: stg_tse__pesquisas_eleitorais
    description: Pesquisas registradas no PesqEle, tipadas e com sentinelas de nulo do TSE tratadas.
    columns:
      - name: nr_protocolo_registro
        data_tests: [unique, not_null]
      - name: dt_registro
        data_tests: [not_null]
      - name: dt_divulgacao
        data_tests: [not_null]
      - name: st_pesquisa_propria
        data_tests:
          - accepted_values:
              arguments:
                values: ['S', 'N']
      - name: nr_cnpj_empresa
        data_tests:
          - not_null
          - dbt_utils.expression_is_true:
              arguments:
                expression: "length(nr_cnpj_empresa) = 14"
      - name: qt_entrevistados
        description: NULL quando o TSE informa zero, negativo ou texto invalido.
        data_tests:
          - not_null:
              config:
                severity: warn
      - name: vr_pesquisa
        data_tests:
          - dbt_utils.accepted_range:
              arguments:
                min_value: 0
              config:
                severity: warn

  - name: stg_tse__totalizacao_presidente_2022
    description: Totalizacao Presidente 2022 despivotada (instante x turno x candidato).
    columns:
      - name: ts_totalizacao
        data_tests: [not_null]
      - name: nr_turno
        data_tests:
          - accepted_values:
              arguments:
                values: [1, 2]
                quote: false
      - name: pc_votos_validos_acumulado
        data_tests:
          - dbt_utils.accepted_range:
              arguments:
                min_value: 0
                max_value: 100
    data_tests:
      - dbt_utils.unique_combination_of_columns:
          arguments:
            combination_of_columns: [ts_totalizacao, nr_turno, coluna_origem]

  - name: stg_wikipedia__intencao_voto_2026
    description: Celulas das wikitables de intencao de voto, tipadas, sem artefatos e com datas de campo.
    columns:
      - name: tp_resposta
        data_tests:
          - accepted_values:
              arguments:
                values: ['Candidato', 'Não-resposta']
      - name: dt_fim_campo
        data_tests:
          - not_null:
              config:
                severity: warn
      - name: qt_amostra
        data_tests:
          - not_null:
              config:
                severity: warn
      - name: pc_valor
        data_tests:
          - dbt_utils.accepted_range:
              arguments:
                min_value: 0
                max_value: 100
